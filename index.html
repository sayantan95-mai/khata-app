<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Software Testing — revision handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1F3; --surface:#FFFFFF; --ink:#17222C; --muted:#63737F;
    --hair:#D9DFE5; --pass:#2F6B45; --fail:#B23A22; --skip:#A8760F; --steel:#2C5A8A;
    --code-bg:#152029; --code-fg:#DCE6EE;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:30;background:var(--paper);
    border-bottom:1px solid var(--hair);
  }
  .top-inner{max-width:820px;margin:0 auto;padding:12px 16px 0}
  h1{font-size:19px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
  h1 span{color:var(--muted);font-weight:400}
  .session{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    margin:6px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .session b{color:var(--pass);font-weight:500}
  .modes{display:flex;gap:0;border-bottom:1px solid transparent}
  .modes button{
    appearance:none;background:none;border:0;border-bottom:2px solid transparent;
    font:500 14px/1 var(--sans);color:var(--muted);padding:12px 14px;cursor:pointer
  }
  .modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .modes button:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}

  /* ---------- module chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font-family:var(--mono);font-size:12px;padding:7px 11px;
    border:1px solid var(--hair);background:var(--surface);border-radius:3px;
    color:var(--muted);cursor:pointer;min-height:34px
  }
  .chip[data-done="1"]{color:var(--pass);border-color:#BBD3C3}
  .chip[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- search ---------- */
  .search{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:4px;
    font:400 15px var(--sans);background:var(--surface);color:var(--ink);margin:14px 0 4px}
  .search:focus{outline:2px solid var(--steel);outline-offset:-1px}

  /* ---------- module ---------- */
  .rule{
    display:flex;align-items:center;gap:10px;margin:30px 0 12px;
    font-family:var(--mono);font-size:12px;color:var(--muted)
  }
  .rule::after{content:"";flex:1;height:1px;background:var(--hair)}
  h2{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:600;letter-spacing:-.015em}
  .why{color:var(--muted);font-size:14px;margin:0 0 16px}

  .digest{border-left:2px solid var(--ink);padding:2px 0 2px 14px;margin:0 0 18px}
  .digest li{margin:0 0 9px;list-style:none}
  .digest ul{margin:0;padding:0}
  .digest code,p code,li code,.trap code{
    font-family:var(--mono);font-size:.86em;background:#E3E8EC;padding:1px 4px;border-radius:3px
  }

  details.dd{border:1px solid var(--hair);background:var(--surface);border-radius:5px;margin:0 0 10px}
  details.dd>summary{
    cursor:pointer;padding:13px 14px;font-weight:500;font-size:15px;list-style:none;
    display:flex;align-items:center;gap:9px
  }
  details.dd>summary::-webkit-details-marker{display:none}
  details.dd>summary::before{
    content:"+";font-family:var(--mono);color:var(--steel);font-size:15px;width:12px
  }
  details.dd[open]>summary::before{content:"\2212"}
  details.dd[open]>summary{border-bottom:1px solid var(--hair)}
  .dd-body{padding:4px 14px 14px}
  .dd-body p{margin:12px 0}

  pre{
    background:var(--code-bg);color:var(--code-fg);border-radius:5px;margin:12px 0;
    padding:13px 13px 13px 14px;overflow-x:auto;position:relative
  }
  pre code{font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre}
  .cp{
    position:absolute;top:7px;right:7px;background:#25333F;color:#9FB3C4;border:0;
    border-radius:3px;font:500 11px var(--mono);padding:5px 8px;cursor:pointer
  }
  .cp:active{background:var(--pass);color:#fff}
  .k{color:#8FB8E8}.s{color:#B7D9A0}.c{color:#6E8496;font-style:italic}
  .d{color:#E0B36A}.n{color:#D9A7C7}

  .traps{margin:16px 0 0}
  .trap{
    display:flex;gap:9px;font-size:14.5px;padding:10px 12px;background:#FBF3F0;
    border-left:2px solid var(--fail);border-radius:0 4px 4px 0;margin-bottom:7px
  }
  .trap span:first-child{font-family:var(--mono);color:var(--fail);font-weight:600}

  .mark{
    display:flex;align-items:center;gap:10px;margin:18px 0 4px;padding:11px 13px;
    border:1px dashed var(--hair);border-radius:5px;background:var(--surface);
    font-family:var(--mono);font-size:13px;color:var(--muted);cursor:pointer;width:100%;
    text-align:left
  }
  .mark[data-done="1"]{color:var(--pass);border-style:solid;border-color:#BBD3C3;background:#F3F8F4}

  /* ---------- drill ---------- */
  .q{border:1px solid var(--hair);background:var(--surface);border-radius:5px;padding:15px;margin:0 0 12px}
  .q-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:7px}
  .q-text{font-weight:500;margin:0 0 12px}
  .opt{
    display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--hair);
    border-radius:4px;padding:11px 12px;margin:0 0 7px;font:400 15px/1.4 var(--sans);
    color:var(--ink);cursor:pointer
  }
  .opt code{font-family:var(--mono);font-size:.87em}
  .opt.right{background:#EFF6F1;border-color:var(--pass);color:var(--pass);font-weight:500}
  .opt.wrong{background:#FBF0ED;border-color:var(--fail);color:var(--fail)}
  .opt[disabled]{cursor:default}
  .why-box{
    font-size:14px;border-left:2px solid var(--hair);padding-left:12px;margin-top:11px;color:#3D4A55
  }
  .scoreline{font-family:var(--mono);font-size:13px;padding:12px 0;color:var(--muted)}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:26px 20px;
    min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;
    cursor:pointer;font-size:17px;line-height:1.5
  }
  .card .side{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px}
  .card code{font-family:var(--mono);font-size:.88em;background:#E3E8EC;padding:1px 4px;border-radius:3px}
  .card-nav{display:flex;gap:8px;margin-top:12px}
  .card-nav button{
    flex:1;padding:12px;border:1px solid var(--hair);background:var(--surface);border-radius:4px;
    font:500 14px var(--sans);color:var(--ink);cursor:pointer;min-height:44px
  }
  .card-nav button:active{background:var(--paper)}

  .hint{font-size:13.5px;color:var(--muted);margin:14px 0 0}
  .empty{font-family:var(--mono);font-size:13px;color:var(--muted);padding:30px 0}
  @media (min-width:700px){ h1{font-size:22px} h2{font-size:26px} body{font-size:17px} }
  @media (prefers-reduced-motion:no-preference){ details.dd[open] .dd-body{animation:f .18s ease-out} }
  @keyframes f{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Python for software testing <span>— revision handbook</span></h1>
    <div class="session" id="session"></div>
    <nav class="modes" role="tablist">
      <button role="tab" id="tab-notes" aria-selected="true" data-mode="notes">Notes</button>
      <button role="tab" id="tab-drill" aria-selected="false" data-mode="drill">Drill</button>
      <button role="tab" id="tab-cards" aria-selected="false" data-mode="cards">Cards</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="pane-notes">
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="Search topics, e.g. fixture scope, monkeypatch, waits">
    <div id="notes"></div>
  </div>

  <div id="pane-drill" hidden>
    <div class="chips" id="drill-chips"></div>
    <div id="drill"></div>
  </div>

  <div id="pane-cards" hidden>
    <div class="chips" id="card-chips"></div>
    <div id="cards"></div>
  </div>
</div>

<script>
const MODULES = [
{
n:"01", id:"core", title:"Python core, tester's cut",
why:"The handful of language rules that actually cause test bugs: identity, mutability, truthiness, copying.",
digest:[
 "<code>==</code> compares value, <code>is</code> compares identity. Only use <code>is</code> for <code>None</code>, <code>True</code>, <code>False</code>.",
 "Mutable: list, dict, set, most objects. Immutable: int, str, tuple, frozenset. Assignment never copies — it binds a second name to the same object.",
 "Falsy values: <code>0</code>, <code>0.0</code>, <code>\"\"</code>, <code>[]</code>, <code>{}</code>, <code>()</code>, <code>None</code>. So <code>if response.json():</code> silently treats an empty list as a failure.",
 "<code>list.copy()</code> is shallow. Nested test data needs <code>copy.deepcopy()</code>.",
 "f-strings do the work: <code>f\"{value!r}\"</code> for repr in assertion messages, <code>f\"{price:.2f}\"</code>, <code>f\"{total=}\"</code> prints <code>total=42</code>.",
 "Strings are immutable — building a locator in a loop with <code>+=</code> makes a new object each time; use <code>join</code> or f-strings.",
 "Chained comparison works: <code>200 &lt;= status &lt; 300</code>."
],
deep:[
 {h:"Identity vs equality in assertions",
  body:"Two objects can be equal and not identical. Small ints and short strings are interned by CPython, which makes <code>is</code> look like it works — until it doesn't. Never let an identity check into an assertion unless you mean identity.",
  code:`a = [1, 2, 3]
b = [1, 2, 3]
a == b        # True  -> same contents
a is b        # False -> different objects

x = 256; y = 256
x is y        # True  (interned) -- do not rely on this
x = 257; y = 257
x is y        # False on most builds

# In tests:
assert resp.error is None        # correct: identity of a singleton
assert resp.items == expected    # correct: value comparison`},
 {h:"Mutable default arguments and shared state",
  body:"A default argument is evaluated once, at function definition. A mutable default is then shared by every call — a classic source of tests that pass alone and fail in a suite.",
  code:`def add_user(name, users=[]):      # BROKEN
    users.append(name)
    return users

add_user("ana")   # ['ana']
add_user("bob")   # ['ana', 'bob']  <- leaked

def add_user(name, users=None):    # correct
    users = [] if users is None else users
    users.append(name)
    return users`},
 {h:"Shallow vs deep copy of test payloads",
  body:"Building one base payload and mutating copies per test case is standard practice. A shallow copy shares nested dicts, so mutating a nested key contaminates every other case.",
  code:`import copy

BASE = {"user": {"name": "ana", "roles": ["viewer"]}, "active": True}

shallow = BASE.copy()
shallow["user"]["name"] = "bob"
BASE["user"]["name"]            # 'bob'  <- leaked

deep = copy.deepcopy(BASE)
deep["user"]["name"] = "bob"
BASE["user"]["name"]            # 'ana'  <- safe`},
 {h:"Truthiness in API assertions",
  body:"Explicit is safer than truthy when a value has a meaningful empty state. An empty list, a zero count and a missing key all collapse to falsy, so a truthy check cannot tell you which happened.",
  code:`data = resp.json()

if not data:              # fires for [], {}, 0, None, ""
    raise AssertionError("no data")

# say what you mean instead
assert data is not None, "body was not JSON"
assert len(data["items"]) == 3, f"got {len(data['items'])} items"`}
],
traps:[
 "<code>is</code> against a literal string or number — passes on your machine, fails in CI on a different build.",
 "A shared list or dict at module level in <code>conftest.py</code> mutated by one test and read by another. Test order then decides the result.",
 "<code>assert response.text</code> to mean 'a body came back' — an empty 200 body passes as falsy and fails the assertion for the wrong reason.",
 "Comparing floats with <code>==</code>. Use <code>pytest.approx(1.1, rel=1e-3)</code>."
],
quiz:[
 {q:"A test mutates <code>payload['user']['id']</code> after <code>payload = BASE.copy()</code>. What happens to BASE?",
  opts:["Unchanged — copy() is safe","BASE['user']['id'] also changes","Raises TypeError","Only changes if BASE is a module-level global"],
  a:1, why:"copy() is shallow: the outer dict is new, the nested 'user' dict is the same object. Use copy.deepcopy for nested payloads."},
 {q:"Which check correctly asserts an API returned an empty list rather than null?",
  opts:["assert not data","assert data == []","assert data is []","assert len(data)"],
  a:1, why:"`data == []` distinguishes an empty list from None; `not data` is true for both, and `is []` compares identity against a fresh object, which is always False."}
],
cards:[
 {f:"When is <code>is</code> the right operator in a test?", b:"Only for singletons: <code>None</code>, <code>True</code>, <code>False</code>, and sentinel objects you created. Everything else uses <code>==</code>."},
 {f:"Why does <code>def f(x, cache={})</code> leak between tests?", b:"Defaults are evaluated once at definition time, so all calls share the same dict. Use <code>None</code> and build inside the function."},
 {f:"How do you compare floats in pytest?", b:"<code>assert value == pytest.approx(expected, rel=1e-3)</code> — also works on lists and dicts of floats."}
]
},

{
n:"02", id:"data", title:"Collections and comprehensions",
why:"Most assertion work is reshaping a response into something comparable. This is where readable tests are won or lost.",
digest:[
 "<code>dict.get(key, default)</code> never raises; <code>d[key]</code> raises <code>KeyError</code>. In assertions, the raise is usually more useful — it names the missing key.",
 "Compare unordered results as sets: <code>assert set(actual_ids) == set(expected_ids)</code>. Compare ordered results as lists.",
 "Sort with a key, not by hand: <code>sorted(items, key=lambda i: (i['type'], i['name']))</code>.",
 "Comprehensions beat loops for extraction: <code>[u['email'] for u in users if u['active']]</code>.",
 "<code>collections.Counter</code> for duplicate and frequency checks; <code>defaultdict(list)</code> for grouping.",
 "Tuple unpacking makes parametrize readable: <code>for status, expected in cases:</code>.",
 "<code>any()</code> / <code>all()</code> express suite-level rules in one line: <code>assert all(r.ok for r in responses)</code>."
],
deep:[
 {h:"Diff-friendly assertions",
  body:"pytest rewrites assertions and shows a rich diff for lists, dicts and sets. That only helps if you assert on whole structures instead of looping and asserting item by item. One structural assertion gives you the full delta in the failure output.",
  code:`# weak: fails on the first mismatch, tells you nothing about the rest
for user in users:
    assert user["status"] == "active"

# strong: one failure shows every offender
bad = [u["id"] for u in users if u["status"] != "active"]
assert bad == [], f"inactive users: {bad}"

# strong: full dict diff in the report
assert response.json() == {"id": 7, "name": "ana", "roles": ["admin"]}`},
 {h:"Set operations for coverage checks",
  body:"Sets answer 'what is missing' and 'what is extra' directly, which is exactly the shape of a data-validation failure.",
  code:`expected = {"id", "name", "email", "created_at"}
actual = set(response.json().keys())

missing = expected - actual
extra = actual - expected
assert not missing, f"missing fields: {sorted(missing)}"
assert not extra, f"unexpected fields: {sorted(extra)}"`},
 {h:"Grouping and counting",
  body:"Counter and defaultdict remove a lot of bookkeeping when validating reports, search results or DB rows.",
  code:`from collections import Counter, defaultdict

counts = Counter(row["region"] for row in rows)
assert counts["UK"] == 12
assert counts.most_common(1)[0][0] == "UK"

by_status = defaultdict(list)
for order in orders:
    by_status[order["status"]].append(order["id"])
assert by_status["failed"] == []`},
 {h:"Dict merging for payload variants",
  body:"The <code>|</code> operator (3.9+) builds a variant payload without touching the base — the cleanest way to drive negative test cases.",
  code:`BASE = {"name": "ana", "email": "a@x.com", "age": 30}

cases = [
    ("missing email", {k: v for k, v in BASE.items() if k != "email"}),
    ("blank name",    BASE | {"name": ""}),
    ("negative age",  BASE | {"age": -1}),
]
# note: | is shallow too -- nested dicts are still shared`}
],
traps:[
 "<code>set()</code> comparison hides duplicates. <code>[1,1,2]</code> and <code>[1,2]</code> compare equal as sets — use <code>Counter</code> when duplicates matter.",
 "Sorting dicts of mixed types raises <code>TypeError</code> in Python 3. Give <code>sorted</code> an explicit key.",
 "Comprehensions with a side effect (appending, clicking, asserting) — write a loop; a comprehension used for its effects hides intent.",
 "<code>d.get('missing')</code> returning <code>None</code> then flowing into an assertion produces 'None != 5' instead of 'key missing'."
],
quiz:[
 {q:"An endpoint returns items in a non-deterministic order. What is the cleanest assertion for exact contents including duplicates?",
  opts:["assert set(actual) == set(expected)","assert sorted(actual) == sorted(expected)","assert actual == expected","assert len(actual) == len(expected)"],
  a:1, why:"sorted() preserves duplicates and normalises order. set() would pass even if an item appeared twice."},
 {q:"Which gives the most useful pytest failure output when 3 of 50 users are inactive?",
  opts:["A loop asserting each user","assert all(u['status']=='active' for u in users)","assert [u['id'] for u in users if u['status']!='active'] == []","assert len(users) == 50"],
  a:2, why:"It fails once and prints the offending ids. `all()` only reports False; the loop stops at the first bad user."}
],
cards:[
 {f:"Set vs Counter in assertions?", b:"Set = membership only, duplicates collapse. Counter = membership plus multiplicity. Use Counter whenever duplicates are a real defect."},
 {f:"How do you build payload variants without mutating the base?", b:"<code>BASE | {\"field\": bad_value}</code> for overrides, or a dict comprehension to drop keys. Both are shallow — deepcopy for nested."},
 {f:"Why prefer one structural assertion over a loop of assertions?", b:"pytest's assertion rewriting prints a full diff of the structure; a loop stops at the first failure and hides the rest."}
]
},

{
n:"03", id:"functions", title:"Functions, closures, decorators",
why:"Fixtures, markers, retries and custom helpers are all built from these. Understanding decorators demystifies pytest.",
digest:[
 "<code>*args</code> collects positionals into a tuple, <code>**kwargs</code> collects keywords into a dict. Order in a signature: positional, <code>*args</code>, keyword-only, <code>**kwargs</code>.",
 "A bare <code>*</code> forces keyword-only arguments: <code>def click(locator, *, timeout=5)</code> — good for helper APIs that read well at call sites.",
 "A decorator is a function that takes a function and returns a replacement. <code>@retry</code> is just <code>login = retry(login)</code>.",
 "Always use <code>functools.wraps</code> inside a decorator or pytest loses the test's name, docstring and signature.",
 "Closures capture variables by reference, not by value — a loop variable captured in a closure ends up at its last value.",
 "<code>functools.partial</code> pre-binds arguments: <code>get_json = partial(session.get, timeout=10)</code>.",
 "Type hints are documentation the IDE enforces: <code>def find(sel: str, timeout: float = 5) -> Element:</code>."
],
deep:[
 {h:"Writing a retry decorator",
  body:"The pattern behind pytest-rerunfailures and most flaky-handling utilities. Note the layers: outer takes configuration, middle takes the function, inner takes the call arguments.",
  code:`import functools, time

def retry(times=3, delay=0.5, on=(AssertionError,)):
    def decorator(func):
        @functools.wraps(func)          # keeps __name__ for reporting
        def wrapper(*args, **kwargs):
            last = None
            for attempt in range(1, times + 1):
                try:
                    return func(*args, **kwargs)
                except on as exc:
                    last = exc
                    time.sleep(delay * attempt)   # linear backoff
            raise last
        return wrapper
    return decorator

@retry(times=3, on=(TimeoutError,))
def load_dashboard(page):
    page.goto("/dashboard")`},
 {h:"Why functools.wraps matters in test code",
  body:"Without wraps, every decorated function reports as <code>wrapper</code>. pytest collects by name, so undecorated names break reports, <code>-k</code> filtering and traceback readability.",
  code:`def timed(func):
    def wrapper(*a, **kw):
        return func(*a, **kw)
    return wrapper

@timed
def test_login(): ...

test_login.__name__     # 'wrapper'  -> unusable in reports

# with @functools.wraps(func) on wrapper:
test_login.__name__     # 'test_login'`},
 {h:"The late-binding closure trap",
  body:"Generating tests or callbacks in a loop is common in data-driven testing. The closure reads the variable when it runs, not when it was created.",
  code:`checks = []
for status in (200, 404, 500):
    checks.append(lambda: assert_status(status))   # all see 500

checks = []
for status in (200, 404, 500):
    checks.append(lambda s=status: assert_status(s))  # bound at creation

# better still: let pytest do it
@pytest.mark.parametrize("status", [200, 404, 500])
def test_status(status): ...`},
 {h:"Keyword-only arguments in page helpers",
  body:"Boolean and numeric positionals at a call site are unreadable six months later. Forcing keywords makes the helper self-documenting without a comment.",
  code:`def upload(path, *, wait=True, timeout=30, retries=2): ...

upload("a.csv", True, 30, 2)                  # TypeError, and good
upload("a.csv", wait=True, timeout=30)        # reads as English`}
],
traps:[
 "Decorating a test and forgetting <code>functools.wraps</code> — pytest reports every test as <code>wrapper</code>.",
 "A decorator that swallows the exception and returns <code>None</code>: the test then passes silently. Re-raise the last error.",
 "Mutable default in a helper (<code>headers={}</code>) that later gets an auth token added — every subsequent call carries it.",
 "Putting retry logic on assertions instead of on waits. Retrying a bad assertion hides a real bug; retrying a slow element is legitimate."
],
quiz:[
 {q:"You wrap a test in a custom decorator without functools.wraps. What breaks first?",
  opts:["The test never runs","Reports and -k filtering show 'wrapper' instead of the test name","Fixtures stop injecting","Nothing"],
  a:1, why:"wraps copies __name__, __doc__ and __wrapped__. Without it, pytest sees a generic wrapper — and fixture injection also breaks, since pytest reads the signature."},
 {q:"In a loop, <code>callbacks.append(lambda: check(i))</code> for i in 0,1,2. What does the first callback check?",
  opts:["0","2","Raises NameError","Undefined behaviour"],
  a:1, why:"Closures capture the variable, not its value. All three see i's final value, 2. Bind with a default argument or use parametrize."}
],
cards:[

@contextmanager
def feature_flag(api, name, value=True):

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const KW = "def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|yield|try|except|finally|raise|assert|lambda|None|True|False|pass|async|await|global|is|break|continue";
const RE = new RegExp(
  '(#[^\\n]*)' +
  '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|[frbu]*"(?:[^"\\\\\\n]|\\\\.)*"|[frbu]*\'(?:[^\'\\\\\\n]|\\\\.)*\')' +
  '|(@[A-Za-z_][\\w.]*)' +
  '|\\b(' + KW + ')\\b' +
  '|\\b(\\d+(?:\\.\\d+)?)\\b', 'g');

function hl(code) {
  let out = "", last = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "d" : m[4] ? "k" : "n";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function codeBlock(src) {
  return '<pre><button class="cp" data-code="1">copy</button><code>' + hl(src.trim()) + "</code></pre>";
}

// ---------- state ----------
const state = { mode: "notes", filter: "all", done: new Set(), score: { ok: 0, no: 0 }, card: 0, deck: [] };

async function saveDone() {
  try { await window.storage.set("revised", JSON.stringify([...state.done])); } catch (e) { /* memory only */ }
}
async function loadDone() {
  try {
    const r = await window.storage.get("revised");
    if (r && r.value) JSON.parse(r.value).forEach((id) => state.done.add(id));
  } catch (e) { /* first run */ }
}

// ---------- progress ----------
function renderSession() {
  const dots = MODULES.map((m) => (state.done.has(m.id) ? "<b>.</b>" : "\u00b7")).join("");
  $("#session").innerHTML = "revision session [" + dots + "] " + state.done.size + " of " + MODULES.length + " marked revised";
}

// ---------- chips ----------
function renderChips(container, onPick) {
  const items = [{ id: "all", label: "all 15" }].concat(
    MODULES.map((m) => ({ id: m.id, label: m.n + " " + m.title.split(",")[0].toLowerCase() }))
  );
  container.innerHTML = items.map((i) =>
    '<button class="chip" data-id="' + i.id + '"' +
    (state.filter === i.id ? ' aria-current="true"' : "") +
    (state.done.has(i.id) ? ' data-done="1"' : "") +
    ">" + i.label + "</button>"
  ).join("");
  container.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => { state.filter = b.dataset.id; onPick(); })
  );
}

// ---------- notes ----------
function moduleHTML(m) {
  const digest = '<div class="digest"><ul>' + m.digest.map((d) => "<li>" + d + "</li>").join("") + "</ul></div>";
  const deep = m.deep.map((d) =>
    '<details class="dd"><summary>' + d.h + '</summary><div class="dd-body">' +
    "<p>" + d.body + "</p>" + (d.code ? codeBlock(d.code) : "") + "</div></details>"
  ).join("");
  const traps = '<div class="traps">' + m.traps.map((t) =>
    '<div class="trap"><span>!</span><span>' + t + "</span></div>").join("") + "</div>";
  const marked = state.done.has(m.id);
  return (
    '<section data-mod="' + m.id + '">' +
    '<div class="rule">' + m.n + " " + m.id + "</div>" +
    "<h2>" + m.title + "</h2>" +
    '<p class="why">' + m.why + "</p>" +
    digest +
    '<p class="hint">Deep dive \u2014 tap to open</p>' +
    deep + traps +
    '<button class="mark" data-mark="' + m.id + '" data-done="' + (marked ? 1 : 0) + '">' +
    (marked ? "[x] revised" : "[ ] mark as revised") + "</button>" +
    "</section>"
  );
}

function renderNotes() {
  const q = $("#search").value.trim().toLowerCase();
  let list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  if (q) {
    list = MODULES.filter((m) => JSON.stringify(m).toLowerCase().includes(q));
  }
  const host = $("#notes");
  if (!list.length) {
    host.innerHTML = '<div class="empty">no match for "' + esc(q) + '" \u2014 try: fixture, monkeypatch, wait, retry</div>';
    return;
  }
  host.innerHTML = (q ? '<div class="scoreline">' + list.length + " module(s) match \u201c" + esc(q) + "\u201d</div>" : "") +
    list.map(moduleHTML).join("");
  host.querySelectorAll("[data-mark]").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.mark;
      state.done.has(id) ? state.done.delete(id) : state.done.add(id);
      saveDone(); renderSession(); renderNotes(); renderChips($("#chips"), renderNotes);
    })
  );
}

// ---------- drill ----------
function renderDrill() {
  const list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  const qs = list.flatMap((m) => m.quiz.map((q) => ({ ...q, mod: m.n + " " + m.title })));

    '<div class="scoreline" id="score"></div>' +
    qs.map((q, i) =>

      '<div class="q-tag">' + q.mod + "</div>" +
      '<p class="q-text">' + q.q + "</p>" +
      q.opts.map((o, j) => '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + o + "</button>").join("") +
      '<div class="why-box" hidden>' + q.why + "</div></div>"

    b.addEventListener("click", () => {
      const box = b.closest(".q"), i = +b.dataset.q, chosen = +b.dataset.o;
      if (box.dataset.answered) return;
      box.dataset.answered = "1";
      box.querySelectorAll(".opt").forEach((o, j) => {
        o.disabled = true;
        if (j === qs[i].a) o.classList.add("right");
        else if (j === chosen) o.classList.add("wrong");
      });
      box.querySelector(".why-box").hidden = false;
      chosen === qs[i].a ? state.score.ok++ : state.score.no++;
      updateScore();
    })
  );
}
function updateScore() {
  const el = $("#score"); if (!el) return;
  const { ok, no } = state.score;
  el.innerHTML = "===== <b style='color:var(--pass)'>" + ok + " passed</b>" +
    (no ? ", <b style='color:var(--fail)'>" + no + " failed</b>" : "") + " =====";
}

// ---------- cards ----------
function renderCards() {
  const list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  state.deck = list.flatMap((m) => m.cards.map((c) => ({ ...c, mod: m.n })));
  state.card = 0;
  $("#cards").innerHTML =
    '<div class="card" id="card"></div>' +
    '<div class="card-nav">' +
    '<button id="prev">back</button><button id="flip">flip</button>' +
    '<button id="shuffle">shuffle</button><button id="next">next</button></div>' +
    '<p class="hint">Tap the card to flip. Say the answer out loud before you flip \u2014 recognition is not recall.</p>';
  paintCard(false);
  $("#card").addEventListener("click", () => paintCard(!$("#card").dataset.back));
  $("#flip").addEventListener("click", () => paintCard(!$("#card").dataset.back));
  $("#next").addEventListener("click", () => { state.card = (state.card + 1) % state.deck.length; paintCard(false); });
  $("#prev").addEventListener("click", () => { state.card = (state.card - 1 + state.deck.length) % state.deck.length; paintCard(false); });
  $("#shuffle").addEventListener("click", () => {
    for (let i = state.deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
    }
    state.card = 0; paintCard(false);
  });
}
function paintCard(showBack) {
  const c = state.deck[state.card], el = $("#card");
  if (!c) { el.innerHTML = '<div class="side">no cards</div>'; return; }
  el.dataset.back = showBack ? "1" : "";
  el.innerHTML = '<div class="side">' + c.mod + " \u00b7 " + (state.card + 1) + " of " + state.deck.length +
    " \u00b7 " + (showBack ? "answer" : "prompt") + "</div><div>" + (showBack ? c.b : c.f) + "</div>";
}

// ---------- modes ----------
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("#pane-notes").hidden = mode !== "notes";
  $("#pane-drill").hidden = mode !== "drill";
  $("#pane-cards").hidden = mode !== "cards";
  if (mode === "notes") { renderChips($("#chips"), renderNotes); renderNotes(); }
  if (mode === "drill") { state.score = { ok: 0, no: 0 }; renderChips($("#drill-chips"), renderDrill); renderDrill(); }
  if (mode === "cards") { renderChips($("#card-chips"), renderCards); renderCards(); }
  window.scrollTo({ top: 0 });
}

// ---------- wire up ----------
document.querySelectorAll(".modes button").forEach((b) =>
  b.addEventListener("click", () => setMode(b.dataset.mode))
);
$("#search").addEventListener("input", renderNotes);
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-code]");
  if (!btn) return;
  const text = btn.parentElement.querySelector("code").innerText;
  navigator.clipboard?.writeText(text).then(() => {
    btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1200);
  }).catch(() => (btn.textContent = "select manually"));
});

(async () => {
  await loadDone();
  renderSession();
  setMode("notes");
})();

</script>
</body>
</html>
