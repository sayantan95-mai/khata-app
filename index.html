deep:[
 {h:"Patch where it is used",
  body:"<code>patch</code> works by replacing an attribute on a module object for the duration of the block, then putting the original back. So the target string is not the thing you want to fake — it is the location where the code under test will look it up.</p><p><code>from requests import get</code> creates a new name, <code>get</code>, inside <code>myapp.service</code>. It points at the same function object, but it is a separate binding. Patching <code>requests.get</code> rebinds the attribute on the <code>requests</code> module only; <code>myapp.service.get</code> still points at the original function, so the real HTTP call goes out and your mock is never touched. Patching <code>myapp.service.get</code> rebinds the name the code actually resolves at call time, and the fake takes effect.</p><p>The rule is short — patch where it is used, not where it is defined — and the corollary is that <code>import requests</code> followed by <code>requests.get(...)</code> is patched at <code>requests.get</code>, because in that style the lookup happens on the module at call time. Which import style the code under test uses therefore determines your target string.</p><p>This mistake is dangerous because it fails silently in the safe direction: the test passes, having exercised the real dependency or having done nothing at all. Asserting <code>mock.call_count</code> or <code>assert_called_once_with(...)</code> catches it, because a mock that was never used has a count of zero.",
  code:`# myapp/service.py
from requests import get          # local name: myapp.service.get

def fetch(url):
    return get(url).json()

# test
from unittest.mock import patch

with patch("myapp.service.get") as mock_get:      # correct
    mock_get.return_value.json.return_value = {"ok": True}
    assert fetch("/x") == {"ok": True}

with patch("requests.get"):                       # does nothing here
    ...`},
 {h:"side_effect: sequences, exceptions and logic",
  body:"<code>return_value</code> gives every call the same answer. <code>side_effect</code> is the flexible sibling and accepts three different things, each solving a different testing problem.</p><p>Assign an exception class or instance and the mock raises it on call. That is how you test error paths you cannot produce on demand — a timeout, a connection reset, a 500 from a dependency, a disk error. These branches are usually the least tested and the most damaging in production, and mocking is often the only practical way to reach them.</p><p>Assign a list and the mock walks it, one entry per call, raising any entry that is an exception. That is exactly the shape of retry logic: fail, fail, succeed. Pairing it with <code>call_count</code> lets you assert the number of attempts, which is the part of a retry policy most likely to be wrong. If the list runs out, the mock raises <code>StopIteration</code>, which is a useful signal that the code called more times than you expected.</p><p>Assign a function and the mock calls it with the same arguments, so the fake can respond differently per input — 200 for one endpoint, 500 for another, a different payload per user id. Keep those functions small; a fake with real logic in it becomes a second implementation you now have to trust.",
  code:`from unittest.mock import MagicMock
import requests

client = MagicMock()

# raise an exception
client.get.side_effect = requests.Timeout("connection timed out")

# a sequence: fail twice, then succeed -> proves the retry works
client.get.side_effect = [requests.Timeout, requests.Timeout, MagicMock(status_code=200)]
assert fetch_with_retry(client, "/x").status_code == 200
assert client.get.call_count == 3

# dynamic behaviour
def by_url(url, **kw):
    return MagicMock(status_code=200 if url.endswith("/ok") else 500)
client.get.side_effect = by_url`},
 {h:"monkeypatch, the pytest-native option",
  body:"<code>monkeypatch</code> is a built-in function-scoped fixture for temporarily changing things. Every modification it makes is recorded and reversed automatically when the test ends, including when the test fails, which is the property that makes it safer than doing the same edits by hand.</p><p>It covers the environments where global state normally leaks. <code>setenv</code> and <code>delenv</code> for environment variables (<code>raising=False</code> means do not complain if it was absent). <code>setattr</code> for module attributes, constants and methods, targeted either by object or by a dotted string. <code>setitem</code> and <code>delitem</code> for dictionary entries such as a settings map. <code>chdir</code> for the working directory. <code>syspath_prepend</code> for import paths.</p><p>The distinction from <code>unittest.mock.patch</code> is intent rather than power. <code>patch</code> gives you a Mock with call recording and assertion helpers, which you want when the interaction itself is under test. <code>monkeypatch</code> just substitutes a value, which is what you want for configuration, constants and small stubs where nobody needs to assert on how they were called.</p><p>Because it is function-scoped, it cannot be used from a session-scoped fixture. For that, build your own with <code>MonkeyPatch.context()</code> or restructure so the substitution happens per test.",
  code:`def test_uses_env_base_url(monkeypatch):
    monkeypatch.setenv("BASE_URL", "https://test.local")
    monkeypatch.delenv("PROXY", raising=False)
    monkeypatch.setattr("myapp.config.TIMEOUT", 1)
    monkeypatch.setitem(settings, "retries", 0)
    monkeypatch.chdir(tmp_path)

    assert build_client().base_url == "https://test.local"
    # everything restored automatically`},
 {h:"autospec and faking HTTP at the right level",
  body:"A plain <code>Mock</code> says yes to everything. Any attribute access returns a new mock, any call signature is accepted, and any method name works — including one you misspelled. So <code>mock.assert_called_once_wiht(x)</code> creates an attribute called <code>assert_called_once_wiht</code>, calls it, gets a mock back, and passes. The assertion you thought you wrote never ran.</p><p><code>autospec=True</code> (or <code>create_autospec</code>) builds the mock from the real object by inspection, so it has the same attributes, the same method names and the same signatures. Wrong arity raises <code>TypeError</code> exactly as the real object would, a misspelled assertion raises <code>AttributeError</code>, and a refactor that changes a signature breaks the test instead of leaving it green against an interface that no longer exists. The cost is a little speed and occasional friction with dynamic attributes; the benefit is that the mock stays honest as the code evolves.</p><p>For HTTP there is a better option than mocking at all. Libraries such as <code>responses</code>, <code>requests-mock</code> and <code>respx</code> intercept at the transport layer, so your production code path — session setup, headers, retries, JSON parsing, error handling — executes for real and only the network is faked. You register the URL, status and body you want, and afterwards you can assert on the recorded calls, including how many were made and what was sent.</p><p>That distinction is the general principle: fake as close to the system boundary as you can. Mocking your own service class tests that the mock behaves; faking the network tests that your code does.",
  code:`from unittest.mock import patch
import responses

with patch("myapp.client.ApiClient.get_user", autospec=True) as m:
    m.return_value = {"id": 1}
    # wrong arity now raises TypeError, as the real method would

@responses.activate
def test_handles_500():
    responses.add(responses.GET, "https://api.x/users/1",
                  json={"detail": "boom"}, status=500)
    with pytest.raises(ApiError):
        get_user(1)
    assert len(responses.calls) == 1`}
],

deep:[
 {h:"A session fixture with retries and auth",
  body:"A <code>requests.Session</code> is not just a convenience wrapper. It keeps a connection pool, so repeated calls to the same host reuse the TCP and TLS handshake instead of repeating it, and it holds headers and cookies that apply to every request. Building it once per session and injecting it into tests removes both a per-test cost and a per-test opportunity to forget the auth header.</p><p>The <code>Retry</code> policy is mounted on an adapter, so retrying happens inside the transport with no visible change to your test code. <code>backoff_factor</code> spaces the attempts out progressively rather than hammering a service that is already struggling. Two settings are safety-critical. <code>status_forcelist</code> lists only transient infrastructure failures — 502, 503, 504 — because retrying a 400 or a 422 just repeats a request the server has already judged invalid, and retrying a 500 can hide a real defect. <code>allowed_methods</code> restricts retries to idempotent verbs; a retried POST can create two orders, turning a network blip into corrupted data and an intermittently failing test.</p><p>The timeout deserves the same attention. <code>requests</code> has no default timeout, so a hung connection blocks until the CI job's own limit kills it, producing a job that failed with no failure message. Binding a default with <code>functools.partial</code> means every call inherits one and any call can still override it.</p><p>Closing the session after <code>yield</code> releases the pooled connections, which matters most in long parallel runs where each worker holds its own.",
  code:`import requests
from requests.adapters import HTTPAdapter
from urllib3.util.retry import Retry

@pytest.fixture(scope="session")
def api(base_url, token):
    s = requests.Session()
    s.headers.update({"Authorization": f"Bearer {token}",
                      "Accept": "application/json"})
    retry = Retry(total=3, backoff_factor=0.4,
                  status_forcelist=[502, 503, 504],
                  allowed_methods=["GET", "HEAD"])   # idempotent only
    s.mount("https://", HTTPAdapter(max_retries=retry))
    s.request = functools.partial(s.request, timeout=15)   # global timeout
    yield s
    s.close()`},
 {h:"Layered assertions with a readable failure",
  body:"Order the assertions so the first failure is the most informative one. Status and content type come first, because if the service returned 500 or an HTML error page then every assertion about fields is noise generated by a problem you already know about. Schema comes second and answers whether the response has the shape the contract promises. Business values come last and answer whether the behaviour was right.</p><p>A validation model — pydantic here, jsonschema if you prefer plain JSON — replaces a stack of presence and type checks with one executable contract. It checks every field at once and reports all violations together, catches type drift such as an id arriving as a string, and rejects a field that quietly disappeared. Keeping the model in one module also makes it a readable statement of what the API promises, useful well beyond the test that validates it.</p><p>The small detail that saves the most time is <code>, resp.text</code> on the status assertion. Without it the failure reads <code>assert 422 == 200</code>, which says a request was rejected and nothing about why. With it, the API's own validation message — usually naming the offending field — is right there in the log, and most triage ends at that line.</p><p><code>raise_for_status()</code> has its place in helpers and setup code, where you just want to stop on an unexpected error. Inside a test, assert the exact status instead: it states the expectation explicitly, and it distinguishes a 201 from a 200 in a way that <code>raise_for_status</code> cannot.",
  code:`from pydantic import BaseModel, EmailStr, ValidationError

class UserOut(BaseModel):
    id: int
    email: EmailStr
    active: bool
    roles: list[str]

def test_get_user(api, base_url):
    resp = api.get(f"{base_url}/users/1")

    assert resp.status_code == 200, resp.text          # 1. transport
    assert resp.headers["content-type"].startswith("application/json")

    user = UserOut.model_validate(resp.json())          # 2. contract
    assert user.email == "ana@example.com"              # 3. behaviour
    assert "admin" in user.roles`},
 {h:"Negative and boundary coverage by parametrize",
  body:"Validation rules are the part of an API most likely to change quietly and least likely to be covered. A parametrize table turns that whole surface into one test: each row names a field, the bad value, the expected status and a fragment of the expected message, and each row runs as its own test with its own result.</p><p>Deriving each case from a single valid <code>BASE</code> payload with <code>BASE | {field: value}</code> is what keeps the table honest. Exactly one thing is wrong per case, so a 422 can only be caused by the field under test. Hand-written payloads drift apart over time and end up failing for reasons nobody intended.</p><p>Choose the values deliberately rather than randomly. The productive ones are boundaries and type violations: empty, one below and one above a limit, wrong type, wrong format, null, whitespace only, oversized, and a duplicate of something that must be unique. Those are where validation code actually breaks.</p><p>Assert on a stable fragment of the error rather than the whole message, since wording changes far more often than behaviour. If the API returns a machine-readable error code or a field name, assert on that instead — it is both more precise and more durable.",
  code:`BASE = {"email": "a@x.com", "password": "Str0ng!pass", "age": 30}

@pytest.mark.parametrize("field, value, status, detail", [
    ("email",    "",            422, "email"),
    ("email",    "not-an-email",422, "email"),
    ("password", "short",       422, "password"),
    ("age",      -1,            422, "age"),
    ("age",      "thirty",      422, "age"),
], ids=lambda v: str(v)[:14])
def test_signup_validation(api, base_url, field, value, status, detail):
    resp = api.post(f"{base_url}/signup", json=BASE | {field: value})
    assert resp.status_code == status, resp.text
    assert detail in resp.text.lower()`},
 {h:"State, idempotency and cleanup",
  body:"API suites accumulate data. Every run that creates a record and does not remove it makes the next run slower, and eventually one hits a unique constraint or a quota and fails for a reason that has nothing to do with the code under test. The fix is ownership: whatever a test creates, its fixture deletes after <code>yield</code>, so cleanup happens on pass, on fail and on error.</p><p>Asserting on the creation response inside the fixture is worth the extra line. If setup silently fails, the test that follows fails on something unrelated and you spend triage time in the wrong place; asserting in the fixture makes it an error rather than a failure, and pytest labels it as such.</p><p>The second habit is to assert against identifiers you created rather than positions in a list. <code>results[0]</code> assumes ordering, an empty starting state and no other activity — three assumptions that all break as soon as the suite runs in parallel or against a shared environment. Filtering by your own id is stable under all of them.</p><p>Idempotency deserves its own test, because it is a common gap. Calling the same operation twice should either produce the same result or a defined conflict, never a duplicate side effect. Accepting a small set of valid statuses, as the example does with 200 or 409, is legitimate when the contract genuinely allows both — but write down which is which in the assertion message so the next reader knows it was deliberate.",
  code:`@pytest.fixture
def order(api, base_url):
    resp = api.post(f"{base_url}/orders", json={"sku": "X1", "qty": 2})
    assert resp.status_code == 201, resp.text
    created = resp.json()
    yield created
    api.delete(f"{base_url}/orders/{created['id']}")

def test_cancel_is_idempotent(api, base_url, order):
    first = api.post(f"{base_url}/orders/{order['id']}/cancel")
    second = api.post(f"{base_url}/orders/{order['id']}/cancel")
    assert first.status_code == 200
    assert second.status_code in (200, 409), second.text`}
],

n:"12", id:"ui", title:"UI automation in Python",
why:"Selenium and Playwright in Python — locator strategy and waiting are the whole game.",
digest:[
 "Locator priority: role and accessible name, then label or text, then test id, then CSS, then XPath as a last resort.",
 "Playwright locators are lazy and auto-wait for actionability (visible, stable, enabled, receives events). Selenium's <code>find_element</code> resolves immediately.",
 "Never <code>time.sleep()</code>. Use explicit waits on a condition: <code>WebDriverWait(driver, 10).until(EC.element_to_be_clickable(...))</code> or Playwright's <code>expect()</code>.",
 "Implicit waits and explicit waits together produce unpredictable timeouts in Selenium. Pick explicit only.",
 "<code>expect(locator).to_be_visible()</code> retries until the timeout; <code>assert locator.is_visible()</code> checks once. Use <code>expect</code>.",
 "<code>StaleElementReferenceException</code> means the DOM re-rendered after you resolved the element. Re-find, do not sleep.",
 "Assert on user-visible state, not implementation details like class names or internal ids.",
 "Trace, video and screenshots on failure are worth more than any amount of logging."
],
deep:[
 {h:"Waiting, done correctly",
  body:"Every reliable UI test rests on one rule: wait for a condition that proves the application is ready, never for an amount of time. A sleep is a bet on how long something takes, and it loses in both directions — too short on a loaded CI machine, and pure wasted time on every run where the app was ready immediately.</p><p>Playwright builds the waiting into the assertion. <code>expect(locator).to_be_visible()</code> re-queries the DOM in a loop until the condition holds or the timeout expires, so the assertion itself absorbs ordinary variation in load time. Actions do the same: before clicking, Playwright waits for the element to be attached, visible, stable (not mid-animation), enabled and able to receive events. Most of what people write explicit waits for is already handled.</p><p>Selenium keeps the two separate, so you write the wait yourself. <code>WebDriverWait(driver, 10).until(condition)</code> polls until the condition returns something truthy. <code>expected_conditions</code> ships the common ones, and the distinctions matter: presence means in the DOM, visibility means rendered and non-zero size, clickable means visible and enabled. Passing <code>ignored_exceptions</code> lets the wait survive a stale element while the page re-renders, which is otherwise a frequent cause of spurious failures. When nothing built-in fits, any callable that takes the driver works, so a lambda can wait on a network-idle flag, a spinner disappearing or a JavaScript expression.</p><p>One warning specific to Selenium: never combine an implicit wait with explicit waits. The two interact unpredictably, producing timeouts that are neither value and inflating every failed lookup to the full implicit duration. Set the implicit wait to zero and use explicit waits only.",
  code:`# Playwright: web-first assertions retry until timeout
from playwright.sync_api import expect

page.get_by_role("button", name="Save").click()
expect(page.get_by_role("alert")).to_contain_text("Saved")   # retries
expect(page.get_by_role("row")).to_have_count(25)            # retries

# Selenium: explicit wait on a condition
from selenium.webdriver.support.ui import WebDriverWait
from selenium.webdriver.support import expected_conditions as EC
from selenium.webdriver.common.by import By

wait = WebDriverWait(driver, 10, poll_frequency=0.25,
                     ignored_exceptions=(StaleElementReferenceException,))
alert = wait.until(EC.visibility_of_element_located((By.CSS_SELECTOR, "[role=alert]")))
assert "Saved" in alert.text

# custom condition when nothing built-in fits
wait.until(lambda d: d.execute_script("return document.readyState") == "complete")`},
 {h:"Locator strategy that survives a redesign",
  body:"Locator choice determines how often the suite breaks for reasons unrelated to behaviour. The useful test for a locator is: does it describe what the user perceives, or does it describe how the page happens to be built today?</p><p>Role-based locators sit at the top for that reason. <code>get_by_role(&#39;button&#39;, name=&#39;Add to basket&#39;)</code> matches on the accessibility tree — the element's role and its accessible name — which is the same information a screen reader uses. Restyling, moving the element, or changing the surrounding markup leaves it working; changing the label or the semantics breaks it, which is correct, because that is a change in what the user sees. As a side effect these locators fail when accessibility is broken, so they catch a class of defect for free.</p><p>Labels and visible text come next, then explicitly agreed test ids. A <code>data-testid</code> is a contract with the developers: stable, meaningless to users, and safe to depend on precisely because everyone knows it exists for tests. It is the right answer for elements with no accessible name — icon-only buttons, canvases, chart regions.</p><p>Structural CSS and XPath come last. A selector that walks the DOM (<code>div &gt; div:nth-child(3)</code>) or depends on generated class names encodes today's markup and breaks on the next layout change, usually in ten tests at once. Where you need context, scope to a container and search within it, as the row example does: that expresses the user's mental model — the Cancel button in the row for order 4412 — while staying independent of how the table is nested.",
  code:`# best: semantic, readable, resilient
page.get_by_role("button", name="Add to basket")
page.get_by_label("Email address")
page.get_by_role("row", name="Order 4412").get_by_role("button", name="Cancel")

# fine: an explicit, agreed contract with the developers
page.get_by_test_id("checkout-submit")

# fragile: structural
page.locator("div > div:nth-child(3) > button")
driver.find_element(By.XPATH, "//div[2]/table/tbody/tr[1]/td[3]/button")

# scope to a container instead of writing longer selectors
row = page.get_by_role("row").filter(has_text="Order 4412")
row.get_by_role("button", name="Cancel").click()`},
 {h:"Fixtures for browser lifecycle",
  body:"Playwright splits the browser into three levels, and using them correctly gives you speed and isolation at the same time. The browser process is expensive to start, so it belongs in a session fixture. A context is a cheap, fully isolated profile — its own cookies, local storage, permissions, cache — so it belongs in a function fixture. Pages live inside a context.</p><p>That structure means each test gets a genuinely clean browser state in a few milliseconds, with no leftover session from the previous test and no manual cookie clearing, which is never quite complete anyway. Launching a whole browser per test would give the same isolation for perhaps a hundred times the cost.</p><p>Tracing is the other reason to own the context fixture. Starting a trace with screenshots and snapshots and writing it out in teardown gives you a recording you can step through afterwards in the Playwright trace viewer: DOM state at every action, network activity, console output. It is the single most effective way to debug a CI-only failure. Recording unconditionally and keeping only the failures, or gating it behind a flag as in the example, keeps the artefact volume sane.</p><p><code>storage_state</code> is worth knowing about as a follow-up: log in once, save the authenticated state to a file, then create every context from it. Tests start already signed in, which removes both the slowest step and the most commonly flaky one from most UI suites.",
  code:`@pytest.fixture(scope="session")
def browser(playwright):
    b = playwright.chromium.launch(headless=True)
    yield b
    b.close()

@pytest.fixture
def page(browser, request):
    context = browser.new_context(
        viewport={"width": 1280, "height": 800},
        record_video_dir="artifacts/video" if request.config.getoption("--video") else None,
    )
    context.tracing.start(screenshots=True, snapshots=True)
    page = context.new_page()
    yield page
    context.tracing.stop(path=f"artifacts/{request.node.name}.zip")
    context.close()

# reuse a logged-in state instead of logging in per test:
#   context = browser.new_context(storage_state="auth.json")`},
 {h:"Diagnosing flakiness rather than retrying it",
  body:"Flaky tests are not random. They have a small number of causes, and naming the cause is nearly always the fix. Treating them as noise to be rerun means the signal degrades until nobody trusts a red build, which is the point at which the suite stops protecting anything.</p><p>Work through the list in order. A race means the assertion ran before the application finished, and the fix is a condition-based wait. A stale element means the DOM re-rendered between finding and using it, so re-find rather than sleep. Animation means the element moved under the click. Test data means two runs or two workers shared an account or an email address. Order dependence means one test left state behind that another depends on. Environment means a cold start, a slow container or a dependency that was not ready when the suite began.</p><p>The tooling exists to identify which one you have. <code>pytest-randomly</code> shuffles execution order and prints the seed it used; if failures appear only under shuffling, you have order dependence, and rerunning with the same seed reproduces it exactly. <code>--lf</code> reruns only what failed. <code>pytest-repeat</code> runs one test many times to establish a real failure rate before and after a change. Running the suspect test alone, in isolation, distinguishes a broken test from a polluted environment.</p><p>Reruns still have a legitimate use as a stopgap, on one condition: every rerun is recorded and someone owns the follow-up. A rerun that nobody sees is just a slower way of not knowing.",
  code:`# 1. Race: asserted before the app finished. -> web-first assertion / explicit wait
# 2. Stale element: DOM re-rendered.           -> re-find, or use a lazy locator
# 3. Animation: element moves under the click. -> Playwright waits for stability;
#                                                 in Selenium, wait on the final state
# 4. Test data: shared account or fixed email. -> unique data per test
# 5. Order dependence: leftover state.         -> fresh context, cleanup fixtures
# 6. Environment: cold start, slow CI machine. -> health check before the suite

# find order dependence deliberately:
#   pytest -p randomly            (pytest-randomly shuffles)
#   pytest --lf                   (rerun only what failed)
#   pytest test_x.py::test_y -n0  (isolate)`}
],

n:"13", id:"db", title:"Databases and SQL from Python",
why:"Back-end verification: the UI can lie, the API can lie, the row is the truth.",
digest:[
 "Always use parameterised queries: <code>cur.execute(\"... WHERE id = %s\", (uid,))</code>. String formatting is an injection bug in your own tooling.",
 "Placeholder style is driver-specific: <code>?</code> for sqlite3, <code>%s</code> for psycopg and mysql-connector.",
 "Wrap connections in a fixture with <code>yield</code> so they always close.",
 "Prefer transaction rollback over manual delete for cleanup — it is faster and cannot leave orphans.",
 "<code>row_factory</code> (sqlite3) or <code>RealDictCursor</code> (psycopg) gives dict rows instead of positional tuples.",

 "Assert the whole row against a dict, not field by field.",

deep:[
 {h:"A connection fixture with rollback isolation",
  body:"Two fixtures with different scopes do different jobs here. The session-scoped <code>conn</code> opens one connection for the whole run, because connecting is expensive and the connection itself is not test state. The function-scoped <code>db</code> opens a transaction around each test and rolls it back afterwards.</p><p>Rollback is the strongest cleanup available. Inside a transaction the test can insert, update and delete freely; none of it is committed, and the rollback restores the database to exactly its previous state — including rows the test forgot about, sequence side effects aside. Compare that with deleting what you created: it runs only if the test reaches the end, it misses anything created indirectly by a cascade or a trigger, and it can fail on its own foreign keys.</p><p><code>row_factory=dict_row</code> makes cursors return dictionaries instead of positional tuples, so assertions read as field names rather than <code>row[3]</code> and survive a column being added.</p><p>The limitation to be aware of: this only works when the code under test shares your connection. If the write happens through an API in another process, that process has its own transaction, and your rollback cannot reach it. For those tests, go back to fixture-based cleanup through the API — create through the public path, delete through the public path.",
  code:`import psycopg
from psycopg.rows import dict_row

@pytest.fixture(scope="session")
def conn(settings):
    with psycopg.connect(settings["dsn"], row_factory=dict_row) as c:
        yield c

@pytest.fixture
def db(conn):
    with conn.transaction() as tx:      # everything here is provisional
        yield conn
        tx.rollback()                   # never committed`},
 {h:"Parameterised queries and whole-row assertions",
  body:"Passing values as parameters rather than formatting them into the SQL string is not only about injection, though that reason alone is sufficient even in test tooling. The driver also handles quoting and type conversion for you, so a name containing an apostrophe, a datetime, a boolean or a NULL is sent correctly. String building breaks on the first legitimate value that contains a quote.</p><p>The placeholder style belongs to the driver, not to SQL: <code>?</code> for sqlite3, <code>%s</code> for psycopg and MySQL connectors. Parameters are passed as a sequence, which is where the classic typo lives — <code>(uid)</code> is just an integer in brackets, while <code>(uid,)</code> is a one-element tuple. The trailing comma is what makes it a tuple.</p><p>For the assertion, compare the whole row to an expected dict rather than checking one field at a time. pytest then prints a diff naming the column that is wrong, and the test also notices a field that changed unexpectedly — a status that updated correctly while a total was silently recalculated, for instance.</p><p>Select the columns you care about explicitly instead of using <code>SELECT *</code>. It keeps the expected dict small, and it stops the test breaking every time someone adds a column to the table.",
  code:`def get_order(db, order_id):
    with db.cursor() as cur:
        cur.execute(
            "SELECT id, sku, qty, status FROM orders WHERE id = %s",
            (order_id,),                       # tuple -- note the comma
        )
        return cur.fetchone()

def test_cancel_updates_row(api, db, order):
    api.post(f"/orders/{order['id']}/cancel")
    assert get_order(db, order["id"]) == {
        "id": order["id"], "sku": "X1", "qty": 2, "status": "cancelled",
    }`},
 {h:"Polling for eventual consistency",
  body:"Distributed systems separate the acknowledgement from the effect. A 202 means the request was accepted; a queue worker, a read replica or a scheduled job produces the visible result some unpredictable time later. Asserting immediately tests the timing of your test rather than the behaviour of the system.</p><p>A fixed sleep is wrong in both directions: too short on a loaded environment, and pure waste on every run where the work completed in fifty milliseconds. Polling adapts to both — it returns as soon as the condition holds, and it keeps trying until a deadline you chose.</p><p>The helper is small but three details matter. <code>time.monotonic()</code> rather than <code>time.time()</code>, because a clock adjustment during the wait must not shorten or extend the deadline. Keeping the last observed value so the failure message can say what it saw instead of only what it wanted — that difference usually identifies whether the job never ran or ran and produced the wrong answer. And raising <code>AssertionError</code>, so the outcome is reported as a test failure rather than an error.</p><p>Choose the timeout from the system's actual service level, not from what makes the test pass. A poll interval of a few hundred milliseconds is usually right: short enough to stay fast, long enough not to hammer the database.",
  code:`import time

def wait_for(fn, expected, timeout=15, interval=0.5):
    deadline = time.monotonic() + timeout
    last = object()
    while time.monotonic() < deadline:
        last = fn()
        if last == expected:
            return last
        time.sleep(interval)
    raise AssertionError(f"expected {expected!r} within {timeout}s, last saw {last!r}")

wait_for(lambda: get_order(db, oid)["status"], "settled")`},
 {h:"Seeding without coupling to the schema",
  body:"Raw inserts are seductive because they are fast and they can produce any state you want. The cost shows up later. They bypass validation, defaults, triggers and derived fields, so the rows they create are subtly different from anything the application would produce — and a test that starts from an impossible state can pass while the real flow is broken. They also bind your suite to the schema, so every migration breaks tests that have nothing to do with the change.</p><p>Seeding through the public API avoids all of it. The data is created the way a user creates it, side effects and defaults included, and the setup path is itself exercised on every run. It is slower, and that is usually an acceptable price.</p><p>There are genuine exceptions: legacy tables with no API, a state only reachable after thirty days of activity, or bulk data where creating a thousand records through HTTP would dominate the runtime. Handle those with raw SQL, but keep every such statement in one clearly named module rather than scattered through the tests. When a migration lands, there is then exactly one place to fix, and the coupling stays visible instead of spreading.",

@pytest.fixture
def customer(api):
    c = api.post("/customers", json={"name": "ana"}).json()
    yield c
    api.delete(f"/customers/{c['id']}")

# acceptable when there is no API for it -- keep it in one module
def seed_legacy_flag(db, customer_id):

{
n:"14", id:"async", title:"Async and concurrency",
why:"Async Playwright, httpx and load-ish checks. Also a frequent interview probe: what is actually running in parallel.",
digest:[
 "<code>async def</code> makes a coroutine; nothing runs until it is awaited or scheduled on an event loop.",
 "<code>await</code> yields control while waiting on I/O. It does not create a thread.",
 "<code>asyncio.gather(*tasks)</code> runs coroutines concurrently and returns results in argument order.",
 "In pytest use <code>pytest-asyncio</code> with <code>asyncio_mode = \"auto\"</code>, or Playwright's async API with its own plugin.",
 "One blocking call (<code>time.sleep</code>, <code>requests.get</code>) inside async code stalls the entire loop.",
 "Rule of thumb: async or threads for I/O-bound work (HTTP, DB, browser), processes (<code>pytest-xdist</code>) for CPU-bound or isolation.",
 "For test suites, xdist across processes is usually simpler and safer than making the tests themselves async."
],
deep:[
 {h:"Concurrent requests in one test",
  body:"Some behaviour only exists under simultaneity. Overselling the last item in stock, double-charging on a retried payment, two users editing the same record, a lock that is not held long enough — none of these can be reproduced by sending requests one after another, however fast.</p><p><code>asyncio.gather</code> schedules all the coroutines on the event loop at once and waits for them together, returning results in the order you passed them in rather than the order they finished. With an async HTTP client the requests genuinely overlap on the wire, which is what the scenario needs.</p><p><code>return_exceptions=True</code> changes the failure behaviour in an important way. Without it, the first exception propagates immediately and the remaining tasks are cancelled, so you lose the very results you were trying to compare. With it, exceptions come back as ordinary items in the results list and you can assert on the whole distribution.</p><p>That distribution is the assertion. Exactly one 201 and four 409s is a precise statement about correctness under concurrency, and it fails loudly if the service lets two claims through. Note that five concurrent requests is a correctness test, not a load test — it tells you nothing about throughput, and it is not a substitute for real performance testing.",
  code:`import asyncio, httpx

async def test_concurrent_claims(base_url, token):
    async with httpx.AsyncClient(base_url=base_url, timeout=10,
                                 headers={"Authorization": f"Bearer {token}"}) as c:
        results = await asyncio.gather(
            *[c.post("/items/42/claim") for _ in range(5)],
            return_exceptions=True,       # one failure does not cancel the rest
        )
    codes = [r.status_code for r in results if not isinstance(r, Exception)]
    assert codes.count(201) == 1, f"expected exactly one winner, got {codes}"
    assert codes.count(409) == 4`},
 {h:"Async Playwright",
  body:"Playwright ships two APIs over the same engine. The sync one is what most suites use and is simpler to read. The async one mirrors it exactly, with <code>await</code> on every action and assertion, and exists for cases where a single test must drive more than one page at the same time.</p><p>Real-time features are the honest use case: a message appearing in a second user's window, a live dashboard updating, a collaborative document, a notification arriving while another user acts. Two independent pages have to be progressing simultaneously for the scenario to mean anything, and <code>gather</code> is how you advance them together.</p><p>Everything else stays familiar. <code>expect()</code> still retries, so the assertion on the receiving page absorbs the delivery delay without a sleep, and locators work identically. The mechanical difference is that every call is awaited, including <code>expect</code>.</p><p>The constraint worth remembering: the sync and async APIs cannot be mixed in one process, because the sync API cannot run inside a running event loop. Pick one per suite. If you already have a sync suite and need one concurrent scenario, it is usually cleaner to write that single test as a separate async module than to convert everything.",
  code:`import pytest
from playwright.async_api import async_playwright, expect

@pytest.mark.asyncio
async def test_live_message_appears():
    async with async_playwright() as p:
        browser = await p.chromium.launch()
        sender, receiver = await browser.new_page(), await browser.new_page()
        await asyncio.gather(sender.goto("/chat"), receiver.goto("/chat"))

        await sender.get_by_role("textbox").fill("hello")
        await sender.keyboard.press("Enter")
        await expect(receiver.get_by_text("hello")).to_be_visible()
        await browser.close()`},
 {h:"What blocks the loop",
  body:"Async concurrency is cooperative. One thread runs one task at a time, and progress only moves to another task when the current one hits an <code>await</code> on something that is not ready. Everything hinges on every task cooperating.</p><p>A synchronous call breaks the deal. <code>time.sleep(2)</code> holds the thread for two seconds; <code>requests.get()</code> holds it for the duration of the network call. During that time nothing else on the loop runs — no other request, no timeout, no browser action — so ten tasks that each block for a second take ten seconds, exactly as they would sequentially. The failure is silent: no error, just concurrency that quietly is not happening.</p><p>The rule is that anything awaited must be an async-aware implementation. <code>asyncio.sleep</code> instead of <code>time.sleep</code>, <code>httpx.AsyncClient</code> or <code>aiohttp</code> instead of <code>requests</code>, an async database driver instead of a blocking one.</p><p>When a library has no async version — a vendor SDK, a legacy client — <code>asyncio.to_thread(fn, *args)</code> runs it in a worker thread and gives you an awaitable, so the loop keeps serving other tasks while it works. Watch for the reverse mistake too: calling an async function without awaiting it produces a coroutine object that never runs, and only a RuntimeWarning to tell you.",
  code:`import asyncio, time, requests

async def bad():
    time.sleep(2)                 # blocks the whole loop
    requests.get("https://x")     # also blocks

async def good():
    await asyncio.sleep(2)
    async with httpx.AsyncClient() as c:
        await c.get("https://x")

# unavoidable blocking library? push it to a thread:
result = await asyncio.to_thread(legacy_sdk.fetch, "arg")`},
 {h:"Choosing the parallelism model",
  body:"The choice is not about which technology is more modern; it is about what the work is waiting on and what isolation you need. Most QA suites are I/O-bound — waiting on HTTP, on a database, on a browser — so more waiting can happen at once. The question is how to arrange that.</p><p>Process-level parallelism with <code>pytest-xdist</code> is the default answer for a suite. It requires no code changes at all, every worker is genuinely isolated with its own memory and its own fixtures, and a crash in one worker does not take the run down. The costs are startup time per worker and the discipline of making test data unique.</p><p>Async is the answer inside a single test that must do several things at once: fanning out setup requests, driving two browser sessions, checking behaviour under simultaneous access. It is not a way to make an ordinary suite faster, and rewriting a synchronous suite as async is a large change for a smaller gain than xdist gives you for free.</p><p>Threads sit between: useful for parallelising blocking calls inside one test without an async rewrite, at the price of having to think about shared state. Genuine CPU-bound work — hashing large files, parsing big documents, image comparison — needs processes, because the GIL means threads will not help.",
  code:`# I/O-bound suite, ordinary sync tests   -> pytest -n auto        (processes)
# many HTTP calls inside ONE test         -> asyncio.gather + httpx
# two browser sessions interacting        -> async Playwright
# CPU-bound helper (hashing, parsing)     -> multiprocessing / -n auto
# a blocking SDK inside async code        -> asyncio.to_thread`}
],
traps:[
 "Calling an async function without awaiting: you get a coroutine object, no execution, and a RuntimeWarning that is easy to miss.",
 "Mixing sync and async Playwright APIs in one process — the sync API cannot run inside a running event loop.",
 "<code>time.sleep</code> inside a coroutine. The suite gets slower and the concurrency is gone.",
 "<code>gather</code> without <code>return_exceptions=True</code> when you want all results: the first exception propagates and the rest are cancelled.",

],

  a:1, why:"Process-level parallelism needs no code changes and gives isolation. Rewriting to async is a large change for a smaller gain."}
],

 {f:"What does <code>await</code> actually do?", b:"Suspends this coroutine and returns control to the event loop until the awaited operation completes. No thread is created."},

]

n:"15", id:"ci", title:"Quality, CI and flakiness",
why:"The last mile: making the suite fast, trustworthy and readable to people who did not write it.",
digest:[

deep:[
 {h:"A GitHub Actions job that reports properly",
  body:"The job's shape is worth reading as a checklist rather than as YAML. Dependencies are installed from a lock file (<code>uv sync --frozen</code>), so CI runs the exact versions that were tested rather than resolving fresh ones and breaking on a release you did not choose. Browsers are installed with their system dependencies, which is the step most often missing when a UI suite works locally and fails in a container.</p><p>The matrix runs the suite on two Python versions, and <code>fail-fast: false</code> lets both finish. Without it, one failing version cancels the other and you learn half of what the run could have told you. Linting runs before tests because it is seconds rather than minutes; failing fast on cheap checks is free speed.</p><p>The test command carries the reporting flags: <code>--junitxml</code> for the machine-readable results CI uses to render a test summary, coverage in XML for whatever tracks it, <code>-ra</code> for the human-readable summary of everything that was not a plain pass, and <code>--tb=short</code> so the log stays readable. Secrets arrive as environment variables from the secret store, never from the repository.</p><p><code>if: always()</code> on the artefact upload is the line that gets forgotten, and it is the one that matters most. A workflow stops after a failed step by default, so without it the traces, screenshots and reports are uploaded on green runs and skipped on exactly the red runs where you need them.",
  code:`name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - name: tests
        run: uv run pytest -n auto -ra --junitxml=report.xml
             --cov=src --cov-report=xml --tb=short
        env:
          BASE_URL: \${{ secrets.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()                 # artefacts matter most on failure
        with:
          name: results-\${{ matrix.python }}
          path: |
            report.xml
            artifacts/`},
 {h:"Reading coverage honestly",
  body:"Coverage instruments the interpreter and records which lines executed while the tests ran. That is all it measures. It cannot tell whether anything was asserted, so a test that imports a module and calls every function without a single assertion produces excellent coverage and zero confidence.</p><p><code>branch = true</code> makes it meaningfully stricter. Line coverage counts an <code>if</code> as covered when it has run once; branch coverage requires both the true and the false path, which is where most untested behaviour hides. <code>show_missing</code> lists the specific uncovered lines, which is the part you actually act on.</p><p>Use it as a search tool, not a score. The productive question is which important paths have never executed — error handlers, retry branches, permission checks — because those are exactly the ones that break in production. The unproductive question is how to get from 78 to 80 percent, which reliably produces tests written to touch lines rather than to verify behaviour.</p><p><code>fail_under</code> is best set as a floor slightly below where you are, to stop regressions, rather than as a target to chase. <code>omit</code> and <code>exclude_lines</code> keep generated code, type-checking blocks and unreachable branches from distorting the number. And be careful with a coverage gate on pull requests: it creates a direct incentive to write assertion-free tests.",
  code:`# pyproject.toml
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 75            # a floor, not a target
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]`},
 {h:"A flakiness policy that actually works",
  body:"A policy is needed because the default reaction to a flaky test — rerun it, merge, move on — is individually rational and collectively fatal. Confidence in the suite erodes quietly until red builds are ignored, at which point the suite costs money and provides nothing.</p><p>The three stages need to happen in order. Detect: allow a rerun so the pipeline is not blocked, but record every rerun, because a rerun nobody sees is indistinguishable from a passing test. Quarantine: mark the test with a marker and a ticket reference, exclude it from the gating run, and keep running it nightly where it reports without blocking. That keeps the test alive and visible instead of deleted or skipped into oblivion. Reproduce: run it many times in a loop or with a fixed random seed until you can make it fail on demand, since a defect you cannot reproduce is a defect you cannot verify as fixed.</p><p>The critical governance detail is that the quarantine must shrink. Every entry needs an owner and a ticket, and the list should be reviewed on a regular cadence. A quarantine that only grows is a slow way of deleting your test suite.</p><p>Worth remembering: a flaky test is sometimes telling the truth. Intermittent failures often reflect a genuine race, a timeout that is genuinely too tight, or a real defect that only appears under specific timing — and that defect is in the product, not in the test.",
  code:`# 1. Detect: rerun once, and record it
pytest --reruns 1 --reruns-delay 2 -ra

# 2. Quarantine, with the reason attached
@pytest.mark.flaky(reason="JIRA-4412 race on basket totals")
def test_basket_total(): ...

# main pipeline:   pytest -m "not flaky"
# nightly:         pytest -m flaky        (report, do not gate)

# 3. Reproduce
pytest test_basket.py::test_total --count=20 -x     # pytest-repeat
pytest -p randomly --randomly-seed=12345            # fix the seed to replay`},
 {h:"Structuring a suite people can navigate",
  body:"The directory layout is the first documentation anyone reads, and it should answer two questions without help: where does a new test go, and how do I run only the part I care about.</p><p>Splitting by test type — <code>api/</code>, <code>ui/</code>, <code>db/</code> — works because it matches how the suite is actually run. Each stage of a pipeline points at a directory, and each directory has its own <code>conftest.py</code> holding only the fixtures that layer needs, so a UI test never pays to construct an API client it will not use. Global fixtures, hooks and CLI options live in the root conftest, where they are easy to find.</p><p>Keeping page objects, builders and helpers out of the test directories matters more than it looks. pytest collects files matching <code>test_*.py</code>, and support code mixed in with tests invites accidental collection, confusing import errors and a folder where nobody can tell what is a test.</p><p>The result should be that a single test can be run by path with no configuration, and a slice can be selected by directory and marker together. If reproducing a CI failure locally takes more than one command, people stop trying and start pressing rerun instead.",
  code:`tests/
  conftest.py            # global fixtures, hooks, CLI options
  api/
    conftest.py          # api client fixtures
    test_users.py
  ui/
    conftest.py          # browser/page fixtures
    pages/               # page objects (not tests)
    test_checkout.py
  data/                  # json/csv fixtures
  utils/                 # helpers, waits, builders

# pytest tests/api -m smoke -n auto
# pytest tests/ui/test_checkout.py::test_guest_checkout --headed`}
],

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const KW = "def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|yield|try|except|finally|raise|assert|lambda|None|True|False|pass|async|await|global|is|break|continue";
const RE = new RegExp(
  '(#[^\\n]*)' +
  '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|[frbu]*"(?:[^"\\\\\\n]|\\\\.)*"|[frbu]*\'(?:[^\'\\\\\\n]|\\\\.)*\')' +
  '|(@[A-Za-z_][\\w.]*)' +
  '|\\b(' + KW + ')\\b' +
  '|\\b(\\d+(?:\\.\\d+)?)\\b', 'g');

function hl(code) {
  let out = "", last = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "d" : m[4] ? "k" : "n";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

function codeBlock(src) {
  return '<pre><button class="cp" data-code="1">copy</button><code>' + hl(src.trim()) + "</code></pre>";
}

// ---------- state ----------
const state = { mode: "notes", filter: "all", done: new Set(), score: { ok: 0, no: 0 }, card: 0, deck: [] };

async function saveDone() {
  try { await window.storage.set("revised", JSON.stringify([...state.done])); } catch (e) { /* memory only */ }
}
async function loadDone() {
  try {
    const r = await window.storage.get("revised");
    if (r && r.value) JSON.parse(r.value).forEach((id) => state.done.add(id));
  } catch (e) { /* first run */ }
}

// ---------- progress ----------
function renderSession() {
  const dots = MODULES.map((m) => (state.done.has(m.id) ? "<b>.</b>" : "\u00b7")).join("");
  $("#session").innerHTML = "revision session [" + dots + "] " + state.done.size + " of " + MODULES.length + " marked revised";
}

// ---------- chips ----------
function renderChips(container, onPick) {
  const items = [{ id: "all", label: "all 15" }].concat(
    MODULES.map((m) => ({ id: m.id, label: m.n + " " + m.title.split(",")[0].toLowerCase() }))
  );
  container.innerHTML = items.map((i) =>
    '<button class="chip" data-id="' + i.id + '"' +
    (state.filter === i.id ? ' aria-current="true"' : "") +
    (state.done.has(i.id) ? ' data-done="1"' : "") +
    ">" + i.label + "</button>"
  ).join("");
  container.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => { state.filter = b.dataset.id; onPick(); })
  );
}

// ---------- notes ----------
function moduleHTML(m) {
  const digest = '<div class="digest"><ul>' + m.digest.map((d) => "<li>" + d + "</li>").join("") + "</ul></div>";
  const deep = m.deep.map((d) =>
    '<details class="dd"><summary>' + d.h + '</summary><div class="dd-body">' +
    "<p>" + d.body + "</p>" + (d.code ? codeBlock(d.code) : "") + "</div></details>"
  ).join("");
  const traps = '<div class="traps">' + m.traps.map((t) =>
    '<div class="trap"><span>!</span><span>' + t + "</span></div>").join("") + "</div>";
  const marked = state.done.has(m.id);
  return (
    '<section data-mod="' + m.id + '">' +
    '<div class="rule">' + m.n + " " + m.id + "</div>" +
    "<h2>" + m.title + "</h2>" +
    '<p class="why">' + m.why + "</p>" +
    digest +
    '<p class="hint">Deep dive \u2014 tap to open</p>' +
    deep + traps +
    '<button class="mark" data-mark="' + m.id + '" data-done="' + (marked ? 1 : 0) + '">' +
    (marked ? "[x] revised" : "[ ] mark as revised") + "</button>" +
    "</section>"
  );
}

function renderNotes() {
  const q = $("#search").value.trim().toLowerCase();
  let list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  if (q) {
    list = MODULES.filter((m) => JSON.stringify(m).toLowerCase().includes(q));
  }
  const host = $("#notes");
  if (!list.length) {
    host.innerHTML = '<div class="empty">no match for "' + esc(q) + '" \u2014 try: fixture, monkeypatch, wait, retry</div>';
    return;
  }
  host.innerHTML = (q ? '<div class="scoreline">' + list.length + " module(s) match \u201c" + esc(q) + "\u201d</div>" : "") +
    list.map(moduleHTML).join("");
  host.querySelectorAll("[data-mark]").forEach((b) =>
    b.addEventListener("click", () => {
      const id = b.dataset.mark;
      state.done.has(id) ? state.done.delete(id) : state.done.add(id);
      saveDone(); renderSession(); renderNotes(); renderChips($("#chips"), renderNotes);
    })
  );
}

// ---------- drill ----------
function renderDrill() {
  const list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  const qs = list.flatMap((m) => m.quiz.map((q) => ({ ...q, mod: m.n + " " + m.title })));
  $("#drill").innerHTML =
    '<div class="scoreline" id="score"></div>' +
    qs.map((q, i) =>
      '<div class="q" data-i="' + i + '">' +
      '<div class="q-tag">' + q.mod + "</div>" +
      '<p class="q-text">' + q.q + "</p>" +
      q.opts.map((o, j) => '<button class="opt" data-q="' + i + '" data-o="' + j + '">' + o + "</button>").join("") +
      '<div class="why-box" hidden>' + q.why + "</div></div>"
    ).join("");
  updateScore();
  $("#drill").querySelectorAll(".opt").forEach((b) =>
    b.addEventListener("click", () => {
      const box = b.closest(".q"), i = +b.dataset.q, chosen = +b.dataset.o;
      if (box.dataset.answered) return;
      box.dataset.answered = "1";
      box.querySelectorAll(".opt").forEach((o, j) => {
        o.disabled = true;
        if (j === qs[i].a) o.classList.add("right");
        else if (j === chosen) o.classList.add("wrong");
      });
      box.querySelector(".why-box").hidden = false;
      chosen === qs[i].a ? state.score.ok++ : state.score.no++;
      updateScore();
    })
  );
}
function updateScore() {
  const el = $("#score"); if (!el) return;
  const { ok, no } = state.score;
  el.innerHTML = "===== <b style='color:var(--pass)'>" + ok + " passed</b>" +
    (no ? ", <b style='color:var(--fail)'>" + no + " failed</b>" : "") + " =====";
}

// ---------- cards ----------
function renderCards() {
  const list = state.filter === "all" ? MODULES : MODULES.filter((m) => m.id === state.filter);
  state.deck = list.flatMap((m) => m.cards.map((c) => ({ ...c, mod: m.n })));
  state.card = 0;
  $("#cards").innerHTML =
    '<div class="card" id="card"></div>' +
    '<div class="card-nav">' +
    '<button id="prev">back</button><button id="flip">flip</button>' +
    '<button id="shuffle">shuffle</button><button id="next">next</button></div>' +
    '<p class="hint">Tap the card to flip. Say the answer out loud before you flip \u2014 recognition is not recall.</p>';
  paintCard(false);
  $("#card").addEventListener("click", () => paintCard(!$("#card").dataset.back));
  $("#flip").addEventListener("click", () => paintCard(!$("#card").dataset.back));
  $("#next").addEventListener("click", () => { state.card = (state.card + 1) % state.deck.length; paintCard(false); });
  $("#prev").addEventListener("click", () => { state.card = (state.card - 1 + state.deck.length) % state.deck.length; paintCard(false); });
  $("#shuffle").addEventListener("click", () => {
    for (let i = state.deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
    }
    state.card = 0; paintCard(false);
  });
}
function paintCard(showBack) {
  const c = state.deck[state.card], el = $("#card");
  if (!c) { el.innerHTML = '<div class="side">no cards</div>'; return; }
  el.dataset.back = showBack ? "1" : "";
  el.innerHTML = '<div class="side">' + c.mod + " \u00b7 " + (state.card + 1) + " of " + state.deck.length +
    " \u00b7 " + (showBack ? "answer" : "prompt") + "</div><div>" + (showBack ? c.b : c.f) + "</div>";
}

// ---------- modes ----------
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("#pane-notes").hidden = mode !== "notes";
  $("#pane-drill").hidden = mode !== "drill";
  $("#pane-cards").hidden = mode !== "cards";
  if (mode === "notes") { renderChips($("#chips"), renderNotes); renderNotes(); }
  if (mode === "drill") { state.score = { ok: 0, no: 0 }; renderChips($("#drill-chips"), renderDrill); renderDrill(); }
  if (mode === "cards") { renderChips($("#card-chips"), renderCards); renderCards(); }
  window.scrollTo({ top: 0 });
}

// ---------- wire up ----------
document.querySelectorAll(".modes button").forEach((b) =>
  b.addEventListener("click", () => setMode(b.dataset.mode))
);
$("#search").addEventListener("input", renderNotes);
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-code]");
  if (!btn) return;
  const text = btn.parentElement.querySelector("code").innerText;
  navigator.clipboard?.writeText(text).then(() => {
    btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1200);
  }).catch(() => (btn.textContent = "select manually"));
});

(async () => {
  await loadDone();
  renderSession();
  setMode("notes");
})();

</script>
</body>
</html>
