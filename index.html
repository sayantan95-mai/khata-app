<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Software Testing — revision handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1F3; --surface:#FFFFFF; --ink:#17222C; --muted:#63737F;
    --hair:#D9DFE5; --pass:#2F6B45; --fail:#B23A22; --skip:#A8760F; --steel:#2C5A8A;
    --code-bg:#152029; --code-fg:#DCE6EE;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:30;background:var(--paper);
    border-bottom:1px solid var(--hair);
  }
  .top-inner{max-width:820px;margin:0 auto;padding:12px 16px 0}
  h1{font-size:19px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em}
  h1 span{color:var(--muted);font-weight:400}
  .session{
    font-family:var(--mono);font-size:12px;color:var(--muted);
    margin:6px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .session b{color:var(--pass);font-weight:500}
  .modes{display:flex;gap:0;border-bottom:1px solid transparent}
  .modes button{
    appearance:none;background:none;border:0;border-bottom:2px solid transparent;
    font:500 14px/1 var(--sans);color:var(--muted);padding:12px 14px;cursor:pointer
  }
  .modes button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .modes button:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}

  /* ---------- module chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font-family:var(--mono);font-size:12px;padding:7px 11px;
    border:1px solid var(--hair);background:var(--surface);border-radius:3px;
    color:var(--muted);cursor:pointer;min-height:34px
  }
  .chip[data-done="1"]{color:var(--pass);border-color:#BBD3C3}
  .chip[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- search ---------- */
  .search{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:4px;
    font:400 15px var(--sans);background:var(--surface);color:var(--ink);margin:14px 0 4px}
  .search:focus{outline:2px solid var(--steel);outline-offset:-1px}

  /* ---------- module ---------- */
  .rule{
    display:flex;align-items:center;gap:10px;margin:30px 0 12px;
    font-family:var(--mono);font-size:12px;color:var(--muted)
  }
  .rule::after{content:"";flex:1;height:1px;background:var(--hair)}
  h2{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:600;letter-spacing:-.015em}
  .why{color:var(--muted);font-size:14px;margin:0 0 16px}

  .digest{border-left:2px solid var(--ink);padding:2px 0 2px 14px;margin:0 0 18px}
  .digest li{margin:0 0 9px;list-style:none}
  .digest ul{margin:0;padding:0}
  .digest code,p code,li code,.trap code{
    font-family:var(--mono);font-size:.86em;background:#E3E8EC;padding:1px 4px;border-radius:3px
  }

  details.dd{border:1px solid var(--hair);background:var(--surface);border-radius:5px;margin:0 0 10px}
  details.dd>summary{
    cursor:pointer;padding:13px 14px;font-weight:500;font-size:15px;list-style:none;
    display:flex;align-items:center;gap:9px
  }
  details.dd>summary::-webkit-details-marker{display:none}
  details.dd>summary::before{
    content:"+";font-family:var(--mono);color:var(--steel);font-size:15px;width:12px
  }
  details.dd[open]>summary::before{content:"\2212"}
  details.dd[open]>summary{border-bottom:1px solid var(--hair)}
  .dd-body{padding:4px 14px 14px}
  .dd-body p{margin:12px 0}

  pre{
    background:var(--code-bg);color:var(--code-fg);border-radius:5px;margin:12px 0;
    padding:13px 13px 13px 14px;overflow-x:auto;position:relative
  }
  pre code{font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre}
  .cp{
    position:absolute;top:7px;right:7px;background:#25333F;color:#9FB3C4;border:0;
    border-radius:3px;font:500 11px var(--mono);padding:5px 8px;cursor:pointer
  }
  .cp:active{background:var(--pass);color:#fff}
  .k{color:#8FB8E8}.s{color:#B7D9A0}.c{color:#6E8496;font-style:italic}
  .d{color:#E0B36A}.n{color:#D9A7C7}

  .traps{margin:16px 0 0}
  .trap{
    display:flex;gap:9px;font-size:14.5px;padding:10px 12px;background:#FBF3F0;
    border-left:2px solid var(--fail);border-radius:0 4px 4px 0;margin-bottom:7px
  }
  .trap span:first-child{font-family:var(--mono);color:var(--fail);font-weight:600}

  .mark{
    display:flex;align-items:center;gap:10px;margin:18px 0 4px;padding:11px 13px;
    border:1px dashed var(--hair);border-radius:5px;background:var(--surface);
    font-family:var(--mono);font-size:13px;color:var(--muted);cursor:pointer;width:100%;
    text-align:left
  }
  .mark[data-done="1"]{color:var(--pass);border-style:solid;border-color:#BBD3C3;background:#F3F8F4}

  /* ---------- drill ---------- */
  .q{border:1px solid var(--hair);background:var(--surface);border-radius:5px;padding:15px;margin:0 0 12px}
  .q-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:7px}
  .q-text{font-weight:500;margin:0 0 12px}
  .opt{
    display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--hair);
    border-radius:4px;padding:11px 12px;margin:0 0 7px;font:400 15px/1.4 var(--sans);
    color:var(--ink);cursor:pointer
  }
  .opt code{font-family:var(--mono);font-size:.87em}
  .opt.right{background:#EFF6F1;border-color:var(--pass);color:var(--pass);font-weight:500}
  .opt.wrong{background:#FBF0ED;border-color:var(--fail);color:var(--fail)}
  .opt[disabled]{cursor:default}
  .why-box{
    font-size:14px;border-left:2px solid var(--hair);padding-left:12px;margin-top:11px;color:#3D4A55
  }
  .scoreline{font-family:var(--mono);font-size:13px;padding:12px 0;color:var(--muted)}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:26px 20px;
    min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;
    cursor:pointer;font-size:17px;line-height:1.5
  }
  .card .side{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px}
  .card code{font-family:var(--mono);font-size:.88em;background:#E3E8EC;padding:1px 4px;border-radius:3px}
  .card-nav{display:flex;gap:8px;margin-top:12px}
  .card-nav button{
    flex:1;padding:12px;border:1px solid var(--hair);background:var(--surface);border-radius:4px;
    font:500 14px var(--sans);color:var(--ink);cursor:pointer;min-height:44px
  }
  .card-nav button:active{background:var(--paper)}

  .hint{font-size:13.5px;color:var(--muted);margin:14px 0 0}
  .empty{font-family:var(--mono);font-size:13px;color:var(--muted);padding:30px 0}
  @media (min-width:700px){ h1{font-size:22px} h2{font-size:26px} body{font-size:17px} }
  @media (prefers-reduced-motion:no-preference){ details.dd[open] .dd-body{animation:f .18s ease-out} }
  @keyframes f{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Python for software testing <span>— revision handbook</span></h1>
    <div class="session" id="session"></div>
    <nav class="modes" role="tablist">
      <button role="tab" id="tab-notes" aria-selected="true" data-mode="notes">Notes</button>
      <button role="tab" id="tab-drill" aria-selected="false" data-mode="drill">Drill</button>
      <button role="tab" id="tab-cards" aria-selected="false" data-mode="cards">Cards</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="pane-notes">
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="Search topics, e.g. fixture scope, monkeypatch, waits">
    <div id="notes"></div>
  </div>

  <div id="pane-drill" hidden>
    <div class="chips" id="drill-chips"></div>
    <div id="drill"></div>
  </div>

  <div id="pane-cards" hidden>
    <div class="chips" id="card-chips"></div>
    <div id="cards"></div>
  </div>
</div>

<script>
const MODULES = [
{
n:"01", id:"core", title:"Python core, tester's cut",
why:"The handful of language rules that actually cause test bugs: identity, mutability, truthiness, copying.",
digest:[
 "<code>==</code> compares value, <code>is</code> compares identity. Only use <code>is</code> for <code>None</code>, <code>True</code>, <code>False</code>.",
 "Mutable: list, dict, set, most objects. Immutable: int, str, tuple, frozenset. Assignment never copies — it binds a second name to the same object.",
 "Falsy values: <code>0</code>, <code>0.0</code>, <code>\"\"</code>, <code>[]</code>, <code>{}</code>, <code>()</code>, <code>None</code>. So <code>if response.json():</code> silently treats an empty list as a failure.",
 "<code>list.copy()</code> is shallow. Nested test data needs <code>copy.deepcopy()</code>.",
 "f-strings do the work: <code>f\"{value!r}\"</code> for repr in assertion messages, <code>f\"{price:.2f}\"</code>, <code>f\"{total=}\"</code> prints <code>total=42</code>.",
 "Strings are immutable — building a locator in a loop with <code>+=</code> makes a new object each time; use <code>join</code> or f-strings.",
 "Chained comparison works: <code>200 &lt;= status &lt; 300</code>."
],
deep:[
 {h:"Identity vs equality in assertions",
  body:"Two questions look the same and are not. <code>==</code> asks whether two objects hold the same value, and Python answers by calling the type's <code>__eq__</code> method. <code>is</code> asks whether two names point at the same object in memory, and Python answers by comparing addresses. A list built twice from the same numbers is equal but not identical.</p><p>The confusion survives because CPython caches small integers (roughly -5 to 256) and short interned strings, so it reuses one object for them. <code>x is y</code> then returns True for <code>256</code> and False for <code>257</code>. That is an implementation detail, not a language rule: it varies by interpreter version and by whether the value was typed as a literal or built at runtime. A test that relies on it passes on your laptop and fails in a container running a different build, which is one of the harder failures to explain in a stand-up.</p><p>The working rule: use <code>is</code> only for the three singletons (<code>None</code>, <code>True</code>, <code>False</code>) and for sentinel objects you deliberately created to be unique. Everything else in a test — response bodies, ids, strings, numbers, model objects — uses <code>==</code>.",
  code:`a = [1, 2, 3]
b = [1, 2, 3]
a == b        # True  -> same contents
a is b        # False -> different objects

x = 256; y = 256
x is y        # True  (interned) -- do not rely on this
x = 257; y = 257
x is y        # False on most builds

# In tests:
assert resp.error is None        # correct: identity of a singleton
assert resp.items == expected    # correct: value comparison`},
 {h:"Mutable default arguments and shared state",
  body:"Python evaluates a function's default arguments once, at the moment the <code>def</code> statement runs, not on each call. The resulting objects are stored on the function itself (you can see them in <code>add_user.__defaults__</code>) and handed to every call that does not supply that argument.</p><p>For an immutable default such as <code>0</code>, <code>None</code> or <code>&quot;&quot;</code> that is harmless, because nothing can change the object. For a list, dict or set it is a shared bucket. The first call appends to it, the second call gets the same object with the first call's data still inside, and the function silently accumulates state across the whole process. In the example, <code>add_user(&#39;bob&#39;)</code> returns both names because <code>users</code> is literally the same list object as the one the previous call mutated.</p><p>This is a test problem more than an application problem, for two reasons. First, the helper usually works when you run its test alone and misbehaves once other tests have called it, which produces the worst kind of failure: order-dependent and unreproducible in isolation. Second, it hides in framework code — a <code>headers={}</code> default that quietly keeps an auth token from an earlier test, a <code>results=[]</code> accumulator in a reporting helper.</p><p>The fix is the <code>None</code> sentinel: default to <code>None</code>, then build a fresh object inside the body. A fresh object per call is exactly what you want, and the signature still documents that the argument is optional. Linters catch this too — ruff rule B006, from flake8-bugbear.",
  code:`def add_user(name, users=[]):      # BROKEN
    users.append(name)
    return users

add_user("ana")   # ['ana']
add_user("bob")   # ['ana', 'bob']  <- leaked

def add_user(name, users=None):    # correct
    users = [] if users is None else users
    users.append(name)
    return users`},
 {h:"Shallow vs deep copy of test payloads",
  body:"<code>dict.copy()</code>, <code>list.copy()</code>, <code>list(x)</code> and <code>{**d}</code> all make a shallow copy: a new outer container holding references to the very same inner objects. Changing a top-level key on the copy leaves the original alone, which is why the pattern looks safe at first. Changing anything nested reaches through the shared reference and edits the original too.</p><p>Test suites hit this constantly because the standard way to write negative cases is to define one valid payload and derive variants from it. If the payload has any nesting — a user object, a list of line items, an address — then a case that sets <code>payload[&#39;user&#39;][&#39;email&#39;]</code> to an invalid value has just corrupted the base for every case that runs afterwards. Symptoms: the third parametrized case fails, running it alone passes, and reordering the cases moves the failure.</p><p><code>copy.deepcopy()</code> walks the structure and rebuilds every level, so nothing is shared. It costs more, but test payloads are small and correctness matters more here than microseconds. Two alternatives are often cleaner: build the payload from a factory function so each call constructs it fresh, or hold it as a frozen dataclass and produce variants with <code>dataclasses.replace()</code>.",
  code:`import copy

BASE = {"user": {"name": "ana", "roles": ["viewer"]}, "active": True}

shallow = BASE.copy()
shallow["user"]["name"] = "bob"
BASE["user"]["name"]            # 'bob'  <- leaked

deep = copy.deepcopy(BASE)
deep["user"]["name"] = "bob"
BASE["user"]["name"]            # 'ana'  <- safe`},
 {h:"Truthiness in API assertions",
  body:"Any object can be used in a boolean context. Python calls <code>__bool__</code>, or falls back to <code>__len__</code>, so empty containers are false and non-empty ones are true. The falsy set worth memorising: <code>None</code>, <code>False</code>, <code>0</code>, <code>0.0</code>, <code>&quot;&quot;</code>, <code>[]</code>, <code>{}</code>, <code>()</code>, <code>set()</code>.</p><p>That collapsing is the problem in a test. <code>if not data</code> is true when the API returned <code>null</code>, when it returned an empty list, when it returned <code>0</code>, and when the body was an empty string. Those are four different defects with four different owners, and a truthy check reports them identically. Worse is the inverse case: <code>assert resp.json()</code> passes for <code>{&#39;error&#39;: &#39;boom&#39;}</code>, because a non-empty dict is truthy regardless of what is inside it.</p><p>Write the assertion that names the thing you care about. <code>assert data is not None</code> for presence, <code>assert data == []</code> for a deliberate empty result, <code>assert len(data[&#39;items&#39;]) == 3</code> for a count. Each one produces a failure message that points at a single cause, which is the whole purpose of an assertion.",
  code:`data = resp.json()

if not data:              # fires for [], {}, 0, None, ""
    raise AssertionError("no data")

# say what you mean instead
assert data is not None, "body was not JSON"
assert len(data["items"]) == 3, f"got {len(data['items'])} items"`}
],
traps:[
 "<code>is</code> against a literal string or number — passes on your machine, fails in CI on a different build.",
 "A shared list or dict at module level in <code>conftest.py</code> mutated by one test and read by another. Test order then decides the result.",
 "<code>assert response.text</code> to mean 'a body came back' — an empty 200 body passes as falsy and fails the assertion for the wrong reason.",
 "Comparing floats with <code>==</code>. Use <code>pytest.approx(1.1, rel=1e-3)</code>."
],
quiz:[
 {q:"A test mutates <code>payload['user']['id']</code> after <code>payload = BASE.copy()</code>. What happens to BASE?",
  opts:["Unchanged — copy() is safe","BASE['user']['id'] also changes","Raises TypeError","Only changes if BASE is a module-level global"],
  a:1, why:"copy() is shallow: the outer dict is new, the nested 'user' dict is the same object. Use copy.deepcopy for nested payloads."},
 {q:"Which check correctly asserts an API returned an empty list rather than null?",
  opts:["assert not data","assert data == []","assert data is []","assert len(data)"],
  a:1, why:"`data == []` distinguishes an empty list from None; `not data` is true for both, and `is []` compares identity against a fresh object, which is always False."}
],
cards:[
 {f:"When is <code>is</code> the right operator in a test?", b:"Only for singletons: <code>None</code>, <code>True</code>, <code>False</code>, and sentinel objects you created. Everything else uses <code>==</code>."},
 {f:"Why does <code>def f(x, cache={})</code> leak between tests?", b:"Defaults are evaluated once at definition time, so all calls share the same dict. Use <code>None</code> and build inside the function."},
 {f:"How do you compare floats in pytest?", b:"<code>assert value == pytest.approx(expected, rel=1e-3)</code> — also works on lists and dicts of floats."}
]
},

{
n:"02", id:"data", title:"Collections and comprehensions",
why:"Most assertion work is reshaping a response into something comparable. This is where readable tests are won or lost.",
digest:[
 "<code>dict.get(key, default)</code> never raises; <code>d[key]</code> raises <code>KeyError</code>. In assertions, the raise is usually more useful — it names the missing key.",
 "Compare unordered results as sets: <code>assert set(actual_ids) == set(expected_ids)</code>. Compare ordered results as lists.",
 "Sort with a key, not by hand: <code>sorted(items, key=lambda i: (i['type'], i['name']))</code>.",
 "Comprehensions beat loops for extraction: <code>[u['email'] for u in users if u['active']]</code>.",
 "<code>collections.Counter</code> for duplicate and frequency checks; <code>defaultdict(list)</code> for grouping.",
 "Tuple unpacking makes parametrize readable: <code>for status, expected in cases:</code>.",
 "<code>any()</code> / <code>all()</code> express suite-level rules in one line: <code>assert all(r.ok for r in responses)</code>."
],
deep:[
 {h:"Diff-friendly assertions",
  body:"pytest rewrites the bytecode of your test modules at import so that a failing <code>assert</code> can report the intermediate values it computed. For containers it goes further and prints a structural diff: which keys differ, which items are extra, where two lists diverge. That reporting is the reason plain <code>assert</code> beats <code>assertEqual</code> in pytest.</p><p>You only get the benefit if you assert on a whole structure. A <code>for</code> loop with an assertion inside stops at the first bad item and raises, so a run where 3 of 50 users are wrong tells you about exactly one of them. You fix it, rerun, and discover the second. Three round trips through CI to learn what one assertion could have told you at once.</p><p>Two shapes work well. Build a list of offenders with a comprehension and assert that it is empty — the failure message then contains every offending id. Or compare the entire response object to an expected dict or dataclass, and let pytest print the diff. The second is stronger, because it also catches fields that appeared, disappeared or changed type, which a per-field loop never checks.",
  code:`# weak: fails on the first mismatch, tells you nothing about the rest
for user in users:
    assert user["status"] == "active"

# strong: one failure shows every offender
bad = [u["id"] for u in users if u["status"] != "active"]
assert bad == [], f"inactive users: {bad}"

# strong: full dict diff in the report
assert response.json() == {"id": 7, "name": "ana", "roles": ["admin"]}`},
 {h:"Set operations for coverage checks",
  body:"Converting both sides to sets turns a vague failure into two precise ones. <code>expected - actual</code> is exactly the missing items; <code>actual - expected</code> is exactly the unexpected ones. Instead of a wall of text saying two dicts differ, you get a short sorted list naming the fields.</p><p>This is the natural way to check a response contract, a set of returned ids, permissions on a role, or columns in an export. Asserting both directions matters: missing fields are usually a regression, while extra fields are usually an unannounced API change, and conflating them wastes triage time. Sorting the difference before putting it in the message keeps the output stable across runs, since set ordering is arbitrary.</p><p>The one thing sets cannot see is duplication. <code>{1, 1, 2} == {1, 2}</code>, so if a duplicated row is a real defect in your domain, reach for <code>collections.Counter</code> instead, which compares both membership and how many times each item occurred.",
  code:`expected = {"id", "name", "email", "created_at"}
actual = set(response.json().keys())

missing = expected - actual
extra = actual - expected
assert not missing, f"missing fields: {sorted(missing)}"
assert not extra, f"unexpected fields: {sorted(extra)}"`},
 {h:"Grouping and counting",
  body:"<code>Counter</code> is a dict subclass that counts what you feed it, so a frequency check becomes one line instead of a loop with an <code>if key in d</code> dance. Any missing key reads as <code>0</code> rather than raising, which is usually what an assertion about counts wants. <code>most_common(n)</code> gives the top entries already sorted.</p><p><code>defaultdict(list)</code> removes the other piece of bookkeeping: appending to a key that does not exist yet. The factory you pass is called automatically on first access, so <code>by_status[order[&#39;status&#39;]].append(...)</code> always works.</p><p>In practice these are how you validate reports, aggregations, search results and database extracts. The pattern is to reduce whatever the system returned into the same shape as your expectation, then compare the shapes in one assertion, rather than probing individual values one at a time. Note that <code>defaultdict</code> creates a key the moment you read it, so use <code>dict(by_status)</code> or a plain <code>.get</code> when you assert on which keys exist.",
  code:`from collections import Counter, defaultdict

counts = Counter(row["region"] for row in rows)
assert counts["UK"] == 12
assert counts.most_common(1)[0][0] == "UK"

by_status = defaultdict(list)
for order in orders:
    by_status[order["status"]].append(order["id"])
assert by_status["failed"] == []`},
 {h:"Dict merging for payload variants",
  body:"The <code>|</code> operator on dicts, added in Python 3.9, returns a new dict where the right operand wins on conflicts. <code>BASE | {&#39;age&#39;: -1}</code> therefore reads as one valid payload with one field deliberately broken, which is precisely how a negative test case should read. Before 3.9 the equivalents were <code>{**BASE, &#39;age&#39;: -1}</code> or a copy followed by assignment.</p><p>To remove a field rather than override it, use a dict comprehension that filters the key out. Keeping both operations inline in the parametrize table means a reader sees the whole case — its name, its mutation, its expected status — on one line, with no jumping between helper functions.</p><p>The important caveat: <code>|</code> is shallow, exactly like <code>copy()</code>. The new outer dict shares every nested object with the base. As soon as your payload has nesting, override the nested value wholesale (<code>BASE | {&#39;user&#39;: BASE[&#39;user&#39;] | {&#39;email&#39;: &#39;&#39;}}</code>) or deep-copy first.",
  code:`BASE = {"name": "ana", "email": "a@x.com", "age": 30}

cases = [
    ("missing email", {k: v for k, v in BASE.items() if k != "email"}),

 {h:"Writing a retry decorator",
  body:"A decorator is only syntax. <code>@retry(times=3)</code> above <code>def load_dashboard</code> means <code>load_dashboard = retry(times=3)(load_dashboard)</code>, and that explains the three nested layers. The outer function takes configuration and returns the actual decorator. The middle one takes the function being decorated and returns a replacement. The inner <code>wrapper</code> is that replacement: it receives the real call arguments, and it is free to run the original function as many times as it likes.</p><p>Walk the body once. The loop attempts the call and returns immediately on success, so the happy path costs nothing extra. On a listed exception it stores the error and sleeps, with the delay multiplied by the attempt number so a service that needs a moment gets progressively more time. If every attempt fails it re-raises the last exception, which preserves the real error and its traceback instead of inventing a new one.</p><p>Two design details are load-bearing. The <code>on=</code> tuple keeps retries narrow — retrying every <code>Exception</code> would also retry a <code>TypeError</code> in your own code, turning a fast bug into a slow one. And <code>functools.wraps</code> copies the wrapped function's identity onto the wrapper, which is what keeps pytest reporting and fixture injection working. This same three-layer shape is what pytest-rerunfailures, tenacity and most framework decorators are built on.",
  code:`import functools, time

def retry(times=3, delay=0.5, on=(AssertionError,)):
    def decorator(func):
        @functools.wraps(func)          # keeps __name__ for reporting
        def wrapper(*args, **kwargs):
            last = None
            for attempt in range(1, times + 1):
                try:
                    return func(*args, **kwargs)
                except on as exc:
                    last = exc
                    time.sleep(delay * attempt)   # linear backoff
            raise last
        return wrapper
    return decorator

@retry(times=3, on=(TimeoutError,))
def load_dashboard(page):
    page.goto("/dashboard")`},

  body:"A decorator replaces one function object with another. Unless you say otherwise, the replacement is an anonymous wrapper: its <code>__name__</code> is <code>wrapper</code>, its <code>__doc__</code> is empty, its <code>__module__</code> points at the decorator, and its signature is <code>(*args, **kwargs)</code>.</p><p><code>functools.wraps</code> copies that metadata across, and also sets <code>__wrapped__</code> so tools can inspect the original. The line costs nothing and prevents a surprising amount of breakage.</p><p>In pytest the consequences are immediate. Reports and JUnit XML show <code>wrapper</code> for every decorated test, so a CI failure no longer tells you what failed. <code>-k</code> filtering matches against that name, so selecting tests by name stops working. Most damaging: pytest decides which fixtures to inject by reading the function's signature, and an unwrapped <code>(*args, **kwargs)</code> signature advertises no fixture arguments at all, so fixtures silently stop being passed and the test fails with a confusing <code>TypeError</code>. If you ever see several unrelated tests suddenly reporting as <code>wrapper</code>, look for a decorator someone added without <code>wraps</code>.",
  code:`def timed(func):

 {h:"The late-binding closure trap",
  body:"A closure stores a reference to the variable, not a snapshot of its value. The lambda body is not executed when the lambda is created; it is executed later, and at that point it looks up <code>status</code> in the enclosing scope and finds whatever is there now. Since a <code>for</code> loop reuses one variable and leaves it holding the final value, every lambda created in the loop sees that final value.</p><p>The classic symptom is a set of generated checks or callbacks that all test the same thing, so the suite reports three passing tests where only one scenario was ever exercised. Nothing fails, which is why this can sit undetected for a long time.</p><p>Two fixes. Binding the value as a default argument (<code>lambda s=status:</code>) captures it at creation time, because defaults are evaluated when the lambda is defined — the same mechanism that causes the mutable-default trap, used deliberately here. <code>functools.partial(check, status)</code> does the same thing more explicitly. But in a test suite the real answer is usually to stop generating callables at all and let <code>@pytest.mark.parametrize</code> create the separate tests for you, so each case gets its own name, its own result and its own traceback.",
  code:`checks = []
for status in (200, 404, 500):
    checks.append(lambda: assert_status(status))   # all see 500

    checks.append(lambda s=status: assert_status(s))  # bound at creation

def test_status(status): ...`},

  body:"Everything after a bare <code>*</code> in a signature can only be passed by name. Calling <code>upload(&#39;a.csv&#39;, True, 30, 2)</code> then raises a <code>TypeError</code> instead of quietly working, and the only legal call is the self-documenting one.</p><p>This matters most for exactly the kind of helper a test framework accumulates: functions with a required subject and a tail of optional flags and timeouts. Positional booleans are unreadable at the call site — nobody remembers whether the third argument was the timeout or the retry count — and worse, they are silently reorderable. Add a parameter in the middle of the signature and every existing call still runs, now passing values into the wrong slots. Keyword-only arguments make that a loud error at the moment of the change rather than a subtle behavioural shift.</p><p>The same reasoning applies to <code>/</code>, which forces the arguments before it to be positional. It is rarer in test code, but useful when you want the freedom to rename a parameter later without breaking callers.",

 {h:"A page object that does not lie",
  body:"A page object has one job: to describe what a page offers, in the vocabulary of a user, so the test can read as a scenario rather than as a list of selectors. Everything in the class follows from that. Locators are declared once in <code>__init__</code> and named after what they are to a person (<code>self.submit</code>, not <code>self.btn_1</code>). Methods are named after user intentions (<code>login_as</code>), not mechanics (<code>fill_and_click</code>).</p><p>The class takes the <code>page</code> or <code>driver</code> as a constructor argument instead of creating one. That single decision is what makes the object testable, reusable across browsers, and compatible with pytest fixtures — the fixture owns the browser lifecycle, the page object just borrows it.</p><p>Returning the destination page object from a navigating method is the detail most frameworks skip. <code>login_as</code> returns a <code>DashboardPage</code>, so the test's next line can only call things the dashboard actually has. The flow becomes visible in the code, your editor autocompletes correctly, and a change in navigation shows up as a failing type or attribute rather than as a mysterious timeout twenty lines later.</p><p>Note where the assertion lives: in the test, never in the page. The page exposes state through a property such as <code>error_text</code>, and the test decides whether that state is correct. Keeping it that way means one page class serves a positive test, a negative test and an accessibility check without modification, and every failure message names the test's expectation rather than some helper's.",
  code:`class LoginPage:
    URL = "/login"

    def __init__(self, page):
        self.page = page
        self.username = page.get_by_label("Username")
        self.password = page.get_by_label("Password")
        self.submit = page.get_by_role("button", name="Sign in")

        self.page.goto(self.URL)
        return self

    def login_as(self, user, pwd):
        self.username.fill(user)
        self.password.fill(pwd)
        self.submit.click()
        return DashboardPage(self.page)    # navigation is explicit

    def error_text(self):

# the test owns the assertions

    login.username.fill("ana"); login.password.fill("wrong"); login.submit.click()

 {h:"Dataclasses as expected models",
  body:"<code>@dataclass</code> generates the boilerplate from your annotations: <code>__init__</code> that assigns each field, <code>__repr__</code> that prints them, and <code>__eq__</code> that compares them field by field. That last one is what makes it valuable in tests, because it upgrades a whole-object comparison from an identity check to a meaningful value check.</p><p>The payoff is one assertion instead of six. <code>assert actual == expected</code> checks every field at once, and when it fails, pytest prints both objects using the generated <code>__repr__</code> and highlights the fields that differ. Compare that with six separate assertions, where the first mismatch hides the rest, or with a comparison of plain objects, where the failure message is two memory addresses.</p><p><code>asdict()</code> converts back to a plain dict for sending as JSON, so the same model can describe a request and an expected response. <code>field(default_factory=list)</code> is mandatory for mutable defaults — dataclasses actually raise a <code>ValueError</code> at import time if you write <code>roles: list = []</code>, which is the one place Python protects you from the mutable-default trap. Useful extras: <code>frozen=True</code> makes instances immutable and hashable, so a shared test constant cannot be modified by a test that borrows it, and <code>field(compare=False)</code> excludes volatile fields such as timestamps or generated ids from equality.",
  code:`from dataclasses import dataclass, field, asdict

@dataclass
class User:
    name: str
    email: str
    roles: list[str] = field(default_factory=list)   # not roles=[]

 {h:"super() and cooperative init",
  body:"<code>super().__init__(page)</code> calls the parent's initialiser. If a child defines its own <code>__init__</code> and omits that call, the parent's body never runs, so every attribute the parent would have set simply does not exist. The failure appears later as an <code>AttributeError</code> on <code>self.timeout</code> or <code>self.header</code>, usually far from the class that caused it.</p><p>Python resolves <code>super()</code> through the method resolution order, so it works correctly through several levels and with mixins. Passing arguments explicitly (rather than relying on defaults) keeps the intent readable when someone later inserts a class in the middle of the hierarchy.</p><p>The design point matters more than the syntax. A base page should hold only what is genuinely common to every page — the driver reference, a default timeout, maybe a shared wait helper. The moment it starts collecting page-specific locators, every page inherits attributes it does not use and a change for one screen risks all the others. Shared widgets that appear on many pages belong in their own component classes, held as attributes: <code>self.header = HeaderComponent(page)</code>. Composition like that can be added, swapped or removed per page, which inheritance cannot.",
  code:`class BasePage:
    def __init__(self, page, timeout=10):

        self.timeout = timeout
        self.header = HeaderComponent(page)   # composition

 {h:"classmethod vs staticmethod",
  body:"Both live on a class rather than an instance; the difference is the first argument. A <code>classmethod</code> receives the class itself as <code>cls</code>, so it can construct an instance of whatever class it was called on. A <code>staticmethod</code> receives nothing — it is a plain function that happens to be namespaced inside the class.</p><p>That makes <code>classmethod</code> the tool for alternative constructors, which is a recurring need in test frameworks: <code>ApiClient.from_env()</code>, <code>User.from_json(payload)</code>, <code>Config.from_file(path)</code>. Because it uses <code>cls</code> rather than the hardcoded class name, a subclass such as <code>AdminApiClient</code> inherits the constructor and gets back an <code>AdminApiClient</code>, not a base <code>ApiClient</code>. Hardcoding the name is the bug this idiom prevents.</p><p><code>staticmethod</code> earns its place when a helper is conceptually part of the class but needs neither instance nor class state — building an auth header, formatting a locator. If a helper needs neither and is used by more than one class, a module-level function is usually the better home; putting it on a class only to have a namespace is a habit worth resisting.",

 {h:"Asserting on failure properly",
  body:"<code>pytest.raises</code> is a context manager that expects the block to raise. If nothing raises, the test fails; if the wrong type raises, that exception propagates normally. The result is a negative test that reads as a positive statement about behaviour.</p><p>Asserting only the type is usually too weak. <code>ValueError</code> could come from your validation, from a typo in a helper, or from the test data itself, and all three produce a green test. <code>match=</code> narrows it: pytest runs <code>re.search</code> against <code>str(exception)</code>, so a substring is enough, but it is a regular expression — a message containing <code>(</code>, <code>)</code>, <code>$</code>, <code>.</code> or <code>[</code> needs <code>re.escape</code> or it will silently never match. Binding <code>as excinfo</code> gives you the exception object afterwards through <code>excinfo.value</code>, so you can assert on structured attributes such as an error code or field name, which is more stable than message text.</p><p>Keep exactly one call inside the block. The context manager succeeds as soon as anything inside raises a matching exception, so if setup lines are in there too, a broken fixture can satisfy the assertion and the code under test is never reached.</p><p>The complement is worth stating: to assert that something does not raise, just call it. Wrapping it in <code>try/except: pytest.fail()</code> adds nothing, since an uncaught exception already fails the test with a better traceback.",
  code:`import pytest

def test_rejects_negative_amount():

    assert excinfo.value.field == "amount"

with pytest.raises(ValueError, match=re.escape("bad value (x)")):

  body:"Defining one base exception per framework — everything else inheriting from it — buys two things. Callers at the edges can catch broadly with <code>except FrameworkError</code> without also swallowing genuine bugs like <code>AttributeError</code>. And internal code can raise something specific without anyone having to enumerate every type.</p><p>Inheriting from a builtin as well, as <code>ElementNotReady(FrameworkError, TimeoutError)</code> does, means existing code that already handles <code>TimeoutError</code> keeps working. That is how you introduce a hierarchy into a framework that already has callers.</p><p><code>raise ... from exc</code> is the other half. It sets <code>__cause__</code>, so the traceback shows both the original low-level error and your framework-level message, printed as the-above-exception-was-the-direct-cause-of. Without <code>from</code>, Python still shows the original but labels it as an incidental error during handling, and a bare <code>raise NewError(...)</code> inside an <code>except</code> block hides nothing but reads as if the cause were unrelated. In test frameworks this matters because the useful diagnosis usually lives in the original exception while the useful context lives in yours: the message should say which user id and which endpoint, the cause should say which field failed to deserialise.",

class ElementNotReady(FrameworkError, TimeoutError): ...
class ApiContractError(FrameworkError): ...

def get_user(client, uid):

 {h:"Context managers for guaranteed cleanup",
  body:"A <code>with</code> block guarantees that teardown runs no matter how the block ends — normal completion, an assertion failure, an unexpected exception, even a <code>return</code>. That guarantee is the entire reason to prefer it over writing cleanup at the end of a test.</p><p><code>@contextmanager</code> builds one from a generator, and the shape is easy to read once you see the split: everything before <code>yield</code> is setup, the <code>yield</code> hands control to the caller's block, and everything after <code>yield</code> is teardown. The <code>try/finally</code> around the <code>yield</code> is not optional — without it, an exception raised in the caller's block propagates out through the generator and the lines after <code>yield</code> never execute, which silently defeats the whole point.</p><p>Capturing the original value before changing it, and restoring that value rather than a hardcoded default, is what makes the helper safe to nest and safe to run against an environment you do not exclusively own.</p><p>pytest fixtures use exactly this mechanism, which is why a <code>yield</code> fixture is the right home for anything that must be undone across a whole test. Reach for a context manager when the scope is narrower than a test — a flag toggled for three lines, a temporarily authenticated session, a browser tab opened mid-scenario.",
  code:`from contextlib import contextmanager

@contextmanager
def feature_flag(api, name, value=True):
    original = api.get_flag(name)
    api.set_flag(name, value)
    try:
        yield              # the test body runs here
    finally:
        api.set_flag(name, original)   # runs on pass, fail or error

def test_new_checkout(api, page):

  body:"The four blocks each have a distinct job. <code>try</code> holds the operation that might fail — ideally one line. <code>except</code> handles a specific failure. <code>else</code> runs only if nothing was raised. <code>finally</code> runs on the way out regardless of what happened, including when the function returns or re-raises from inside the block.</p><p><code>else</code> looks redundant until you consider what happens when the success path lives inside <code>try</code>. An assertion in there raises <code>AssertionError</code>; if some <code>except</code> clause is broad enough to catch it, your failing assertion has just been converted into a handled error, and the test passes. Keeping <code>try</code> down to the single risky call makes that impossible by construction, and the code documents which line you actually expected to fail.</p><p><code>pytest.fail(msg)</code> inside the <code>except</code> block is the honest way to convert an infrastructure error into a test failure with a readable message. It is far better than letting a raw <code>requests.Timeout</code> traceback stand, because it says what the test was trying to do.</p><p>Use <code>finally</code> for releasing anything you acquired. In a test suite most of that belongs in a fixture instead, but inside helpers and context managers <code>finally</code> is what makes cleanup unconditional.",

deep:[
 {h:"Why pytest cannot find your package",
  body:"An import searches <code>sys.path</code> in order and takes the first match. pytest inserts directories into that path based on where it stops finding <code>__init__.py</code> files, which is why an import can work when you run one file and break when you run the suite from a different directory. The result is the most common new-framework problem: <code>ModuleNotFoundError</code> for your own code.</p><p>The <code>src</code> layout removes the guessing. Because the package lives under <code>src/</code>, it is not accidentally importable from the repository root, so the only way tests can import it is the way a real user would: from an installed distribution. <code>pip install -e .</code> or <code>uv pip install -e .</code> installs it in editable mode, meaning the package is registered on <code>sys.path</code> but still points at your working files, so edits take effect immediately with no reinstall.</p><p>The payoff is that packaging mistakes — a missing subpackage, a data file that never made it into the distribution — fail locally instead of after release. Tests then import with a stable absolute path (<code>from framework.pages import LoginPage</code>) that behaves identically in your editor, in a terminal and in CI.</p><p>The <code>tests/</code> directory itself does not need to be a package, as long as no two test files share a filename. If they do, add an <code>__init__.py</code> to each directory or set <code>importmode=importlib</code> in your pytest config.",

 {h:"pyproject.toml as the single source of config",
  body:"<code>pyproject.toml</code> is the standard project file, and pytest, coverage, ruff and mypy all read their settings from it. Consolidating there ends the situation where <code>pytest.ini</code>, <code>setup.cfg</code>, <code>.coveragerc</code> and a CI workflow each specify slightly different options and nobody can say which one is authoritative.</p><p>Read the pytest section option by option. <code>testpaths</code> stops collection from wandering into virtualenvs and build directories, which is often the difference between a two-second start and a twenty-second one. <code>addopts</code> holds the flags you want on every run, so a local run matches CI by default. <code>-ra</code> prints a summary of everything that was not a plain pass, which is where skips and xfails quietly accumulate.</p><p><code>--strict-markers</code> is the one people regret omitting. Without it a typo like <code>@pytest.mark.smoek</code> is accepted silently, the test is never selected by <code>-m smoke</code>, and your gate has been running a subset of what you think it runs. With it, the typo fails the run immediately. <code>--strict-config</code> does the same for unknown config keys.</p><p>Registering markers in the <code>markers</code> list also documents them: <code>pytest --markers</code> then prints the list with descriptions for anyone joining the project.",

dependencies = ["pytest>=8", "playwright", "requests", "pydantic"]

 {h:"Environment configuration without secrets in git",
  body:"Configuration in a test framework has one failure mode worth designing against: falling back to a default that happens to work. A suite that quietly defaults to <code>localhost</code> when <code>BASE_URL</code> is missing will run green in CI and tell you nothing about staging.</p><p>So separate the two kinds of setting. Anything the run cannot meaningfully proceed without — the base URL, the API key, the database DSN — is read with <code>os.environ[...]</code>, which raises <code>KeyError</code> when absent. Catching that and re-raising a <code>RuntimeError</code> that names the variable turns an obscure traceback into an instruction. Anything with a sensible default — a timeout, a retry count — uses <code>os.getenv(name, default)</code>, with the string converted to its real type at the boundary so a bad value fails at startup rather than in the middle of a test.</p><p><code>@lru_cache</code> on a zero-argument function is a compact singleton: the body runs once, and every later call returns the cached result. It also gives you one obvious place to look when you want to know what the run was configured with.</p><p>Secrets never enter the repository. They come from the CI secret store or a local <code>.env</code> that is git-ignored, and logging should mask them — a token printed in a failed job's output is a token that must now be rotated.",

def settings():

 {h:"Import cost and circular imports",
  body:"Python executes a module's top level once, the first time it is imported, and caches the result in <code>sys.modules</code>. Everything at module level therefore runs during collection, before a single test starts. Reading a large CSV, opening a database connection or launching a browser at import time makes every run pay for it, including <code>pytest --collect-only</code> and your editor's test discovery.</p><p>Circular imports come from the same mechanism. When module A imports B and B imports A, the second import finds A in <code>sys.modules</code> but only partially executed, so a name defined further down A is not there yet and you get an <code>ImportError</code> that names something that plainly exists. The trigger is usually order-dependent, which is why it can appear after an unrelated change.</p><p>Moving the import inside the function that needs it works because the import then runs after both modules are fully loaded. Treat that as a stopgap. The structural fix is to extract the shared piece into a third module that both can depend on, which nearly always reveals that the cycle was a design smell: two modules that each needed to know about the other were really one concept split in the wrong place. In a page-object framework this typically means page classes and the navigation graph should be separated.",

deep:[
 {h:"Loading test data reliably",
  body:"The current working directory is not a property of your project; it is a property of how the process was launched. An IDE runs from the project root, a terminal runs from wherever you happened to be, and a CI step runs from whatever the previous step left. Any path built from it is therefore a coin toss.</p><p><code>__file__</code> is the location of the module that is executing, so <code>Path(__file__).parent / &#39;data&#39;</code> resolves the same way from every launcher. Building the rest with <code>/</code> keeps the separators correct on both Windows and Linux, which is the other half of this class of bug.</p><p><code>csv.DictReader</code> uses the header row for keys, so a case table stays readable and columns can be added without touching the test. Two arguments are not optional in practice: <code>encoding=&#39;utf-8&#39;</code>, because the default depends on the platform and will fail on the first accented character in your test data, and <code>newline=&#39;&#39;</code>, because the csv module handles line endings itself and will otherwise mis-split quoted fields containing newlines.</p><p>Feeding the loaded rows into <code>parametrize</code> with an <code>ids=</code> callable is what makes this pleasant to live with: each row becomes its own test, named after the data rather than <code>case0</code>, <code>case1</code>. Remember that the loader runs at import time, so keep the file small enough that collection stays fast.",
  code:`from pathlib import Path
import json, csv

DATA = Path(__file__).parent / "data"

def load_json(name):
    return json.loads((DATA / name).read_text(encoding="utf-8"))

def load_cases(name):
    with (DATA / name).open(newline="", encoding="utf-8") as fh:
        return list(csv.DictReader(fh))     # [{'user': 'ana', 'expected': '200'}]

@pytest.mark.parametrize("case", load_cases("logins.csv"),
                         ids=lambda c: c["user"])
def test_login(case, api):
    assert api.login(case["user"]).status_code == int(case["expected"])`},
 {h:"tmp_path and file assertions",
  body:"<code>tmp_path</code> is a built-in fixture that hands each test its own empty directory as a <code>pathlib.Path</code>. pytest keeps the last three runs' directories on disk, so after a failure you can go and look at what was actually written — a genuinely useful debugging property that a self-cleaning temp directory would not have.</p><p>Using it removes a whole family of problems: two tests writing the same filename under <code>-n auto</code>, artefacts from an earlier run making a later assertion pass, and generated files being accidentally committed. Its session-scoped sibling <code>tmp_path_factory</code> is for shared setup inside a broader fixture, such as one downloaded binary or one seeded database file per run.</p><p>For the assertion itself, existence is the weakest possible check. A file exists the instant it is created, before a single byte is flushed, so <code>assert path.exists()</code> passes for a zero-length or half-written download. Assert something about the content: a row count, a parsed header, a size, a hash, a specific value. Comparing <code>rows[0].keys()</code> to an expected set also catches a silently renamed or reordered column, which a row count alone would miss.",
  code:`def test_export_produces_csv(tmp_path, app):
    target = tmp_path / "export.csv"
    app.export_orders(target)

    assert target.exists(), "no file was written"
    rows = list(csv.DictReader(target.open(encoding="utf-8")))
    assert len(rows) == 25
    assert rows[0].keys() == {"id", "total", "status"}

# tmp_path      -> Path, per test
# tmp_path_factory -> session-scoped, for shared fixtures`},
 {h:"Comparing downloaded or generated files",
  body:"For binary artefacts — a PDF, a zip, an image — hashing is the cheapest exact comparison. Read both files as bytes, hash them, compare the digests. It is fast, it needs no format-specific library, and it either matches or it does not.</p><p>That bluntness is also the limitation: a failing hash tells you the files differ and nothing about how. So use it where any difference is a defect, and be aware that many formats embed a generation timestamp or a document id, which makes the hash change on every run. For those, compare the extracted content instead of the bytes.</p><p>For text, comparing lists of lines gives pytest something it can diff, so the failure output points at the offending line rather than reporting that two long strings are unequal. Normalise first — line endings, trailing whitespace, and any volatile field such as a timestamp or a generated id — otherwise the test fails for reasons that have nothing to do with the change under test.</p><p>The golden-file pattern this implies needs discipline: the reference file has to be reviewed like code, and regenerating it must be a deliberate act, not a convenient way to make a red test green.",
  code:`import hashlib

def digest(path):
    return hashlib.sha256(Path(path).read_bytes()).hexdigest()

assert digest(downloaded) == digest(expected_fixture)

# text: normalise line endings before comparing
actual = downloaded.read_text(encoding="utf-8").splitlines()
expected = golden.read_text(encoding="utf-8").splitlines()
assert actual == expected`},
 {h:"Layered configuration",
  body:"One framework has to serve at least four situations: a developer running one test locally, the same developer debugging with a visible browser, a CI job against staging, and an on-demand run against a different environment. Layering settings, rather than branching on an environment name, is what lets a single code path serve all four.</p><p>The order is the design. Defaults in code guarantee the framework runs with no setup at all. A config file layered on top captures per-project or per-environment values that belong in version control. Environment variables come next, because that is how CI and container platforms inject values, and because secrets belong there rather than in a file. Command-line flags win last, since they represent the most specific and most deliberate intent — the person typing the command.</p><p>Two implementation notes. Environment variables are always strings, so convert at the boundary: <code>&#39;false&#39;</code> is a non-empty string and therefore truthy, which is the classic reason a headless flag refuses to turn off. And filter out <code>None</code> from the CLI layer, otherwise an unspecified option overrides a perfectly good value from below with nothing.",
  code:`DEFAULTS = {"base_url": "http://localhost:8000", "timeout": 10, "headless": True}

def build_config(file_cfg=None, env=os.environ, cli=None):
    cfg = DEFAULTS | (file_cfg or {})
    if "BASE_URL" in env:  cfg["base_url"] = env["BASE_URL"]
    if "HEADLESS" in env:  cfg["headless"] = env["HEADLESS"].lower() != "false"
    return cfg | {k: v for k, v in (cli or {}).items() if v is not None}`}

deep:[
 {h:"Fixtures: scope, yield and layering",
  body:"A fixture is a function pytest calls for you when a test names it as an argument. That inversion is the whole idea: the test declares what it needs, pytest works out how to build it, in what order, and when to tear it down. Fixtures can request other fixtures the same way, so pytest resolves a small dependency graph before each test.</p><p>Scope decides how often the fixture body runs. <code>function</code> (the default) rebuilds it for every test, giving maximum isolation. <code>session</code> builds it once for the whole run. <code>module</code>, <code>class</code> and <code>package</code> sit between. The trade is always the same: broader scope is faster and more coupled. The safe rule is that read-only or reset-able resources — a browser, an HTTP session, a database connection, an auth token — can be broad, while anything a test will mutate should be per-function.</p><p>Note the layering in the example. The expensive login happens once in <code>api_session</code>; the cheap per-test <code>user</code> fixture reuses that connection but creates and deletes its own data. You get session-level speed with function-level isolation, which is the combination worth aiming for.</p><p>Everything after <code>yield</code> is teardown, and pytest runs it whether the test passed, failed or errored. That is the critical difference from cleanup written at the end of a test body, which is skipped precisely when a failure has left the system dirty. Teardown also runs in reverse order of setup, so dependent resources are released before the things they depend on.",
  code:`# conftest.py
import pytest, requests

@pytest.fixture(scope="session")
def base_url(pytestconfig):
    return pytestconfig.getoption("--base-url")

@pytest.fixture(scope="session")
def api_session(base_url):              # created once for the whole run
    s = requests.Session()
    s.headers["Authorization"] = f"Bearer {login(base_url)}"
    yield s
    s.close()                           # teardown after the last test

@pytest.fixture                          # function scope: fresh per test
def user(api_session, base_url):
    resp = api_session.post(f"{base_url}/users", json={"name": "ana"})
    created = resp.json()
    yield created
    api_session.delete(f"{base_url}/users/{created['id']}")   # always cleans up`},
 {h:"Parametrize properly",
  body:"<code>@pytest.mark.parametrize</code> does not loop inside one test; it generates a separate test item per case at collection time. Each one gets its own name, its own result, its own traceback and its own fixtures. That is why a table of ten cases reports ten results, and why one failing case cannot mask the other nine.</p><p>The first argument names the parameters, and each tuple in the list supplies them in that order. <code>pytest.param</code> is the richer form: it adds <code>id=</code> for a readable name and <code>marks=</code> for per-case markers. Marking a single case <code>xfail</code> with a ticket reference is far better than deleting it or skipping the whole test — the known bug stays documented and executed, and the marker fails loudly when it starts passing if you set <code>strict=True</code>.</p><p>Ids are what make this usable in CI. Without them pytest generates names from the values, and a dict parameter becomes <code>test_signup[payload0]</code>, which tells a reviewer nothing. With them, the failure line in the log is <code>test_signup[blank-email]</code> and triage starts already halfway done.</p><p>Stacking two <code>parametrize</code> decorators produces the cartesian product, so three payloads and two roles give six tests. It is a fast way to expand coverage and an equally fast way to create a suite of two hundred near-identical tests, so use it where the combination genuinely matters.",
  code:`@pytest.mark.parametrize(
    "payload, status, message",
    [
        pytest.param({"email": ""}, 422, "email required", id="blank-email"),
        pytest.param({"email": "nope"}, 422, "invalid email", id="malformed"),
        pytest.param({"email": "a@x.com"}, 201, None, id="valid"),
        pytest.param({"email": "A@X.COM"}, 201, None, id="uppercase",
                     marks=pytest.mark.xfail(reason="BUG-4412 case handling")),
    ],
)
def test_signup(api, payload, status, message):
    resp = api.post("/signup", json=payload)

 {h:"Indirect parametrization and fixture params",
  body:"Sometimes the parameter belongs to the setup rather than to the test body. Running the same scenario against three browsers, two user roles or four API versions is a property of the environment being built, not of the assertions being made.</p><p>A fixture with <code>params=[...]</code> handles this directly: pytest runs every test that requests that fixture once per parameter value, reading the current value from <code>request.param</code>. Adding a browser to the list multiplies the whole module's coverage with a one-line change, and pytest appends the value to each test id so the reports stay distinguishable.</p><p><code>indirect=True</code> is the other direction. The test still declares its cases in a <code>parametrize</code> table, but the values are routed into the fixture instead of into the test function, again via <code>request.param</code>. Use it when the parameter is data the fixture must act on — create a user with this role, seed an account in this state — while the test body stays identical.</p><p>Both features are easy to over-apply. If most of the tests using a parameterised fixture only make sense for one of its values, you have multiplied the runtime for nothing; parameterise the specific tests instead, or split the fixture.",
  code:`@pytest.fixture(params=["chromium", "firefox", "webkit"])
def browser(request, playwright):
    b = getattr(playwright, request.param).launch()
    yield b
    b.close()
# every test using 'browser' now runs three times, ids added automatically

# or drive a fixture from the test's parameter:
@pytest.fixture
def user(request, api):
    return api.create_user(role=request.param)

@pytest.mark.parametrize("user", ["admin", "viewer"], indirect=True)
def test_permissions(user, page): ...`},
 {h:"Markers and selective runs",
  body:"A marker is a label attached to a test, and its purpose is to let a pipeline select a slice without anyone editing code. That makes markers the contract between the suite and CI: <code>smoke</code> gates a deploy, <code>api</code> and <code>ui</code> split the stages, <code>slow</code> and <code>flaky</code> stay out of the fast path.</p><p>The built-in ones cover most needs. <code>skip</code> always skips. <code>skipif</code> skips on a condition evaluated at collection, which is how you exclude platform-specific tests without them showing up as failures. <code>xfail</code> means this is expected to fail: the test still runs, and its failure does not break the build — the right marker for a known, ticketed bug, because the test keeps exercising the code and will tell you when the behaviour changes.</p><p><code>xfail(strict=True)</code> is the version to prefer. Without <code>strict</code>, a test that starts passing is reported as XPASS and the build stays green, so a fixed bug leaves a permanently misleading marker behind. With it, an unexpected pass fails the run and forces someone to remove the marker, which is exactly the prompt you want.</p><p>Always pass <code>reason=</code> with a ticket reference, register every marker in your config, and run with <code>--strict-markers</code> so a typo cannot silently produce an empty selection.",
  code:`@pytest.mark.smoke
@pytest.mark.api
def test_health(api): ...

@pytest.mark.skipif(sys.platform == "win32", reason="POSIX paths only")
def test_permissions(): ...

@pytest.mark.xfail(strict=True, reason="BUG-991: rounding")
def test_totals(): ...      # strict=True means an unexpected PASS fails the run

# pipeline:
#   pytest -m "smoke" --maxfail=1        (gate)
#   pytest -m "not slow and not flaky"   (main)`}

deep:[
 {h:"Fixture factories with tracked cleanup",
  body:"A normal fixture returns one object, which is a problem as soon as a test needs two users, or three orders, or a number of records it decides at runtime. Declaring <code>user1</code>, <code>user2</code> and <code>user3</code> fixtures is the wrong shape.</p><p>A factory fixture returns a function instead. The test calls that function as many times as it likes, with different arguments each time, and gets a fresh object back. Because the fixture closes over a list, it can record everything the test created and remove all of it after <code>yield</code>. The test never has to think about cleanup, and the cleanup still runs when the test fails.</p><p>Two details are worth copying. Keyword overrides (<code>**overrides</code>) let a caller change only the field it cares about, so the factory keeps working as the model grows. Deleting in reverse order of creation respects dependencies — an order created against a customer has to be removed before the customer, or the API returns a foreign-key error during teardown, which is a confusing way to fail.</p><p>The same pattern extends beyond data: a factory that opens browser tabs, a factory that starts background jobs, a factory that mounts feature flags. Anything a test may need an unknown number of, and must not leak.",
  code:`@pytest.fixture
def make_user(api):
    created = []

    def _make(role="viewer", **overrides):
        user = api.create_user(role=role, **overrides)
        created.append(user["id"])
        return user

    yield _make
    for uid in reversed(created):      # reverse order respects dependencies
        api.delete_user(uid)

def test_admin_sees_all(make_user, page):
    admin = make_user(role="admin")
    viewer = make_user(role="viewer", name="ana")
    ...     # both are removed afterwards, pass or fail`},
 {h:"Screenshot on failure, the correct way",
  body:"A fixture cannot see whether the test passed. It runs setup, hands control to pytest, and later runs teardown, with no result attached to it. So capturing evidence only on failure needs a hook to bridge the two.</p><p><code>pytest_runtest_makereport</code> is called after each phase of each test, and a <code>hookwrapper</code> implementation lets you inspect the report pytest just produced. Storing it on the test item under a phase-specific name — <code>report_setup</code>, <code>report_call</code>, <code>report_teardown</code> — makes it readable later from <code>request.node</code>.</p><p>The autouse fixture then does the actual work during teardown: it yields (letting the test run), reads <code>report_call</code>, and captures artefacts only if that phase failed. Checking the phase matters, because a test can also fail in setup, where there may be no page to screenshot at all.</p><p>This is the standard place to attach everything a failure investigation needs: a full-page screenshot, the page HTML, browser console logs, the last API responses, a Playwright trace. It costs nothing on green runs, which is what makes it affordable to capture generously on red ones. Printing the artefact path is a small courtesy that saves the next person a hunt through the CI file browser.",
  code:`# conftest.py
import pytest

@pytest.hookimpl(hookwrapper=True, tryfirst=True)
def pytest_runtest_makereport(item, call):
    outcome = yield
    setattr(item, f"report_{outcome.get_result().when}", outcome.get_result())

@pytest.fixture(autouse=True)
def capture_on_failure(request, page):
    yield                                   # test runs
    report = getattr(request.node, "report_call", None)
    if report and report.failed:
        path = f"artifacts/{request.node.name}.png"
        page.screenshot(path=path, full_page=True)
        print(f"saved {path}")`},
 {h:"Custom options and collection rules",
  body:"<code>pytest_addoption</code> registers command-line flags, which the suite reads through <code>pytestconfig</code> or <code>request.config.getoption(...)</code>. This is how one framework serves several environments without environment-specific branches: <code>--env</code>, <code>--base-url</code>, <code>--headed</code>, <code>--run-slow</code>. Using <code>choices=</code> means a typo fails immediately with a usage message instead of pointing the suite at a non-existent host.</p><p><code>pytest_collection_modifyitems</code> runs after collection and before execution, with the full list of tests in hand. It is the right place for policy that would otherwise be repeated as a decorator on hundreds of tests. Auto-marking by directory keeps markers accurate for free — nobody has to remember to add <code>@pytest.mark.api</code>, and the marker cannot drift from the file's location.</p><p>The second half of the example implements an opt-in: slow tests are collected but skipped unless the flag is present. Skipping rather than deselecting means they still appear in the report with a reason, so their existence stays visible instead of quietly vanishing from the run.</p><p>Hooks are discovered in <code>conftest.py</code>. Global ones belong in the root conftest; a hook buried in a subdirectory only applies to that subtree, which is occasionally what you want and more often a source of confusion.",
  code:`# conftest.py
def pytest_addoption(parser):
    parser.addoption("--env", default="staging", choices=["dev", "staging", "prod"])
    parser.addoption("--run-slow", action="store_true", default=False)

def pytest_collection_modifyitems(config, items):
    # auto-mark by location
    for item in items:
        if "/api/" in str(item.fspath):
            item.add_marker(pytest.mark.api)

    if config.getoption("--run-slow"):
        return
    skip = pytest.mark.skip(reason="needs --run-slow")
    for item in items:
        if "slow" in item.keywords:
            item.add_marker(skip)`},
 {h:"Parallel runs without cross-talk",
  body:"<code>pytest-xdist</code> starts several worker processes and distributes tests between them. Separate processes mean no shared memory and no thread-safety concerns inside your code, but they also mean everything outside the process is shared: the database, the API, the account you log in with, the download directory.</p><p>So the constraint changes from thread safety to data ownership. Any fixed value that must be unique — an email address, a username, an order reference — becomes a race, because two workers will try to create it at the same moment and one will get a conflict. Combining a UUID with the worker id (<code>PYTEST_XDIST_WORKER</code>, which pytest sets to <code>gw0</code>, <code>gw1</code> and so on) gives values that cannot collide and that also tell you which worker produced a given record when you are reading logs afterwards.</p><p>The distribution mode matters. Plain <code>--dist load</code> hands out individual tests, so tests from one file can land on different workers and a module-scoped fixture is rebuilt several times. <code>--dist loadfile</code> keeps a file together, which is usually what a UI suite wants. <code>--dist loadgroup</code> with <code>@pytest.mark.xdist_group</code> lets you pin a set of tests that must share state to one worker.</p><p>The trap that surprises everyone: a session-scoped fixture runs once per worker, not once per run. With <code>-n 8</code> that is eight logins, or eight attempts to seed the same reference data. For genuinely one-shot setup, use a lock file in the shared base temp directory, or do the seeding in a separate CI step before the suite starts.",
  code:`import os, uuid

@pytest.fixture
def unique_email():
    worker = os.getenv("PYTEST_XDIST_WORKER", "gw0")
    return f"test-{worker}-{uuid.uuid4().hex[:8]}@example.com"

# -n auto              spread by test
# --dist loadfile      keep each file on one worker (module fixtures survive)
# --dist loadgroup     with @pytest.mark.xdist_group("checkout")

# session fixtures run ONCE PER WORKER, not once per run.
# For truly-once setup, use a file lock in tmp_path_factory.getbasetemp().parent`}
